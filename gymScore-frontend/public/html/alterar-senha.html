<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alterar Senha - GymScore</title>
    <link rel="icon" type="image/svg+xml" href="/img/favicon.svg">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/alterar-perfil.css">
    <style>
        .strength-bar { height:4px; border-radius:2px; margin-top:4px; transition:width 0.3s, background 0.3s; }
        .strength-label { font-size:0.8em; color:#aaa; margin-top:2px; }
    </style>
</head>
<body>
    <div class="edit-profile-container">
        <a class="gs-voltar" href="/perfil">&larr; Voltar</a>
        <h1>Alterar Senha</h1>
        <form id="changePasswordForm">
            <div class="form-group">
                <label for="senhaAtual">Senha atual</label>
                <div style="position:relative;">
                    <input type="password" id="senhaAtual" required placeholder="Digite sua senha atual" style="padding-right:42px;">
                    <button type="button" data-toggle-pwd="senhaAtual" aria-label="Mostrar/ocultar senha atual"
                        style="position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--text-muted);padding:4px;font-size:1rem;">👁</button>
                </div>
            </div>
            <div class="form-group">
                <label for="novaSenha">Nova senha</label>
                <div style="position:relative;">
                    <input type="password" id="novaSenha" required placeholder="Mínimo 8 caracteres" minlength="8" style="padding-right:42px;">
                    <button type="button" data-toggle-pwd="novaSenha" aria-label="Mostrar/ocultar nova senha"
                        style="position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--text-muted);padding:4px;font-size:1rem;">👁</button>
                </div>
                <div id="strengthBar" class="strength-bar" style="width:0;background:#e74c3c;"></div>
                <div id="strengthLabel" class="strength-label"></div>
            </div>
            <div class="form-group">
                <label for="confirmarSenha">Confirmar nova senha</label>
                <div style="position:relative;">
                    <input type="password" id="confirmarSenha" required placeholder="Repita a nova senha" style="padding-right:42px;">
                    <button type="button" data-toggle-pwd="confirmarSenha" aria-label="Mostrar/ocultar confirmação"
                        style="position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--text-muted);padding:4px;font-size:1rem;">👁</button>
                </div>
            </div>
            <p id="errorMsg" style="color:#e74c3c;display:none;"></p>
            <p id="successMsg" style="color:var(--success-text);display:none;"></p>
            <button type="submit">Salvar nova senha</button>
            <button type="button" id="btnCancelarSenha"
                style="margin-left:10px;background:#555;">Cancelar</button>
        </form>

        <div style="margin-top:20px;padding-top:16px;border-top:1px solid #333;">
            <p style="color:#aaa;font-size:0.85em;">Esqueceu sua senha atual?
                <a href="/esqueci-senha" style="color:var(--success);">Recuperar acesso</a>
            </p>
        </div>
    </div>

<script src="../js/api.js"></script>
<script src="/js/paginas/alterar-senha.js"></script>
</body>
</html>
