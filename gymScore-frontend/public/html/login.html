<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GymScore — Entrar</title>
    <link rel="icon" type="image/svg+xml" href="/img/favicon.svg">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="/css/moderacao.css">
    <style>

        body {
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
        }

        /* Gradiente radial no topo */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 50vh;
            background: radial-gradient(ellipse 80% 40% at 50% 0%, rgba(34,197,94,0.15) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
            transition: background 0.4s;
        }
        [data-perfil="academia"] body::before,
        body[data-perfil="academia"]::before {
            background: radial-gradient(ellipse 80% 40% at 50% 0%, rgba(249,115,22,0.15) 0%, transparent 70%);
        }
        [data-perfil="instrutor"] body::before,
        body[data-perfil="instrutor"]::before {
            background: radial-gradient(ellipse 80% 40% at 50% 0%, rgba(59,156,224,0.15) 0%, transparent 70%);
        }

        .login-wrap {
            position: relative;
            z-index: 1;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .login-inner {
            width: 100%;
            max-width: 440px;
        }

        /* Logo */
        .logo-area {
            text-align: center;
            margin-bottom: 32px;
        }
        .logo-text {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 3rem;
            line-height: 1;
            letter-spacing: 0.04em;
        }
        .logo-gym  { color: var(--accent); }
        .logo-score { color: #eef0f5; }
        .logo-sub {
            font-size: 0.78rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.12em;
            margin-top: 6px;
        }

        /* Abas pill */
        .tab-pills {
            display: flex;
            background: var(--bg-surface);
            border-radius: 30px;
            padding: 4px;
            margin-bottom: 28px;
            gap: 2px;
        }
        .tab-pill {
            flex: 1;
            padding: 9px 6px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            border-radius: 26px;
            cursor: pointer;
            font-size: 0.84rem;
            font-family: inherit;
            font-weight: 600;
            transition: all 0.2s;
        }
        .tab-pill.ativo {
            background: var(--accent);
            color: var(--on-accent);
        }

        /* Campos com ícone */
        .field-icon {
            position: relative;
        }
        .field-icon .gs-input {
            padding-right: 44px;
        }
        .field-icon-btn {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
        }

        /* Botão de entrar */
        .btn-entrar {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 30px;
            background: var(--accent);
            color: var(--on-accent);
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            margin-top: 20px;
        }
        .btn-entrar:active { transform: scale(0.98); }
        .btn-entrar:disabled { opacity: 0.55; cursor: not-allowed; }

        /* Botões secundários */
        .btns-secundarios {
            display: flex;
            gap: 10px;
            margin-top: 14px;
        }
        .btn-outline {
            flex: 1;
            padding: 11px;
            border: 1.5px solid var(--accent);
            border-radius: 30px;
            background: transparent;
            color: var(--accent);
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-outline:hover { background: var(--accent-glow); }
        .btn-link {
            flex: 1;
            padding: 11px;
            border: none;
            border-radius: 30px;
            background: transparent;
            color: var(--text-muted);
            font-family: inherit;
            font-size: 0.85rem;
            cursor: pointer;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s;
        }
        .btn-link:hover { color: var(--text); }

        /* Helper text */
        .field-helper {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 5px;
        }

        /* Footer */
        .login-footer {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            text-align: center;
            font-size: 0.72rem;
            color: var(--text-muted);
            padding: 12px;
            background: rgba(10,10,15,0.8);
            backdrop-filter: blur(8px);
            z-index: 10;
        }
    </style>
</head>
<body data-perfil="atleta">

<div class="login-wrap">
    <div class="login-inner">

        <!-- Logo -->
        <div class="logo-area" aria-label="GymScore">
            <div class="logo-text">
                <span class="logo-gym">GYM</span><span class="logo-score">SCORE</span>
            </div>
            <p class="logo-sub">Plataforma de desafios esportivos</p>
        </div>

        <!-- Abas de perfil -->
        <div class="tab-pills" role="tablist" aria-label="Tipo de acesso">
            <button class="tab-pill ativo" role="tab" aria-selected="true"  data-tab="atleta"   >Atleta</button>
            <button class="tab-pill"       role="tab" aria-selected="false" data-tab="academia" >Academia</button>
            <button class="tab-pill"       role="tab" aria-selected="false" data-tab="instrutor">Instrutor</button>
        </div>

        <!-- Conta banida (Q1): motivo e recurso sem sessão; montado por login.js -->
        <section id="banidoBox" class="gs-card banido-box" aria-live="polite" hidden></section>

        <!-- Formulário -->
        <form id="loginForm" novalidate>
            <!-- Campo e-mail / CPF / CNPJ -->
            <div class="gs-field">
                <label class="gs-label" for="email" id="emailLabel">E-MAIL</label>
                <div class="field-icon">
                    <input type="email" id="email" class="gs-input" autocomplete="username" inputmode="email" autocapitalize="none" spellcheck="false"
                           placeholder="email@exemplo.com" required aria-labelledby="emailLabel">
                </div>
            </div>

            <!-- Campo Senha -->
            <div class="gs-field" style="margin-top:12px;">
                <label class="gs-label" for="password">SENHA</label>
                <div class="field-icon">
                    <input type="password" id="password" class="gs-input" autocomplete="current-password"
                           placeholder="••••••••" required>
                    <button type="button" class="field-icon-btn" id="btnToggleSenha" aria-label="Mostrar ou ocultar senha">
                        <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                             fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                    </button>
                </div>
            </div>

            <p id="errorMsg" class="gs-msg error" style="margin-top:10px;" role="alert"></p>

            <!-- Botão entrar -->
            <button type="submit" class="btn-entrar" id="submitBtn">ENTRAR</button>
        </form>

        <!-- Botões secundários -->
        <p class="field-helper" id="dicaTab" hidden style="text-align:center;margin-top:12px;"></p>
        <div class="btns-secundarios" id="btnsSecundarios">
            <a href="/signup" id="btnCadastrar" class="btn-outline">CADASTRAR</a>
            <a href="/esqueci-senha" class="btn-link">Recuperar senha</a>
        </div>

    </div>
</div>

<footer class="login-footer">Pagamentos via PIX processados pelo Asaas</footer>

<script src="../js/api.js"></script>
<script src="/js/paginas/login.js"></script>
</body>
</html>
