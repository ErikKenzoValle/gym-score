<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil - GymScore</title>
    <link rel="icon" type="image/svg+xml" href="/img/favicon.svg">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/perfil.css">
</head>
<body>
    <div class="profile-container">
        <div class="profile-avatar" id="profileAvatar">👤</div>
        <h1>Seu Perfil</h1>

        <div class="privacy-bar">
            <div id="privacyToggle"></div>
            <small style="color:var(--text-muted);">Dados sensíveis ficam ocultos por padrão (LGPD)</small>
        </div>

        <div class="profile-info" id="profileInfo" aria-live="polite"></div>

        <!-- Botões principais: Editar Perfil = primário (mais usado) -->
        <div class="action-buttons">
            <a href="/alterar-perfil" class="gs-btn gs-btn-primary gs-btn-full" aria-label="Editar informações do perfil">
                Editar Perfil
            </a>
            <a href="/alterar-senha" class="gs-btn gs-btn-secondary gs-btn-full" aria-label="Alterar senha de acesso">
                Alterar Senha
            </a>
            <a href="/carteira" class="gs-btn gs-btn-secondary gs-btn-full" style="border-color:rgba(39,174,96,0.4);color:var(--primary);" aria-label="Abrir carteira: saldo, extrato e saque">
                💰 Carteira
            </a>
            <a href="/depositar" class="gs-btn gs-btn-secondary gs-btn-full" aria-label="Depositar saldo via PIX">
                Depositar Saldo
            </a>
        </div>

        <!-- Sair — link discreto -->
        <div class="logout-row">
            <a href="#" class="logout-link" id="logoutLink" aria-label="Sair da conta">
                Sair da conta
            </a>
        </div>
    </div>

<script src="../js/api.js"></script>
<script>
    if (!Auth.require()) throw new Error('unauthenticated');
    checkLGPDConsent();

    var user = Auth.getUser();
    var generoMap = { M: 'Masculino', F: 'Feminino', O: 'Outro' };

    function formatDate(raw) {
        if (!raw) return '-';
        // Suporta "2005-01-08" e "2005-01-08T00:00:00..."
        var parts = String(raw).split('T')[0].split('-');
        if (parts.length === 3) return parts[2] + '/' + parts[1] + '/' + parts[0];
        return String(raw);
    }

    // Uma linha do perfil: rótulo + valor (texto puro, mascarável via data-private)
    function linha(rotulo, valor, tipoPrivado) {
        var span = h('span', { text: valor, 'data-private': tipoPrivado || null });
        return h('p', null, [h('strong', { text: rotulo }), span]);
    }

    function renderProfile() {
        var box = limpar(document.getElementById('profileInfo'));
        if (!user) { box.appendChild(h('p', { text: 'Erro ao carregar perfil.' })); return; }
        box.appendChild(linha('Nome', nomeCompleto(user), 'name'));
        box.appendChild(linha('E-mail', user.email || '-', 'email'));
        box.appendChild(linha('CPF', user.cpf || '-', 'cpf'));
        box.appendChild(linha('Nascimento', formatDate(user.data_nascimento), 'date'));
        box.appendChild(linha('Gênero', generoMap[user.genero] || user.genero || '-'));
        box.appendChild(linha('Saldo', fmtBRL(user.saldo_centavos), 'currency'));
        Privacy.applyToDOM();
        if (user.nome) document.getElementById('profileAvatar').textContent = user.nome.charAt(0).toUpperCase();
    }

    Privacy.renderToggle('privacyToggle');
    document.addEventListener('privacyChange', renderProfile);
    document.getElementById('logoutLink').addEventListener('click', function(e) {
        e.preventDefault();
        Auth.logout();
    });
    renderProfile();
    renderBottomNav('/perfil');

    // Perfil completo e saldo atualizados vêm de /usuarios/me
    Auth.refresh().then(function(u) { if (u) { user = u; renderProfile(); } });
</script>
</body>
</html>
