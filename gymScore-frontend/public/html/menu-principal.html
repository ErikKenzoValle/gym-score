<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Início - GymScore</title>
    <link rel="icon" type="image/svg+xml" href="/img/favicon.svg">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/menu-principal.css">
</head>
<body>
    <div class="dashboard-page">
        <!-- Header -->
        <header class="dashboard-header">
            <div class="gs-logo" style="margin-bottom:0;">
                <div class="gs-logo-icon">💪</div>
                <span>GymScore</span>
            </div>
            <p class="dashboard-greeting">Olá, <strong id="userName">...</strong>!</p>
        </header>

        <!-- Card de saldo -->
        <div class="saldo-card gs-card">
            <div class="saldo-card-label">Seu saldo</div>
            <div class="saldo-card-row">
                <span class="saldo-value" id="userSaldo">
                    R$ 0,00
                </span>
                <button
                    class="saldo-eye-btn"
                    id="saldoToggleBtn"
                    aria-label="Mostrar ou ocultar saldo"
                    title="Mostrar/ocultar saldo"
                >
                    <span id="eyeIcon">👁</span>
                </button>
            </div>
        </div>

        <!-- Grid de stats — clicáveis -->
        <div class="stats-grid">
            <a href="/desafios" class="stat-card gs-card" id="statDesafios" aria-label="Ver seus desafios">
                <div class="stat-icon" aria-hidden="true">🏆</div>
                <div class="stat-value" id="statDesafiosVal">–</div>
                <div class="stat-label">Desafios ativos</div>
            </a>
            <a href="/amigos" class="stat-card gs-card" id="statAmigos" aria-label="Ver seus amigos">
                <div class="stat-icon" aria-hidden="true">👥</div>
                <div class="stat-value" id="statAmigosVal">–</div>
                <div class="stat-label">Amigos</div>
            </a>
        </div>

        <!-- CTAs -->
        <a href="/desafios?criar=1" class="cta-btn gs-btn gs-btn-primary gs-btn-full" aria-label="Criar um novo desafio">
            + Criar Desafio
        </a>
        <a href="/depositar" class="cta-btn gs-btn gs-btn-secondary gs-btn-full" style="margin-top:10px;" aria-label="Depositar saldo via PIX">
            💰 Depositar Saldo
        </a>
        <a href="/carteira" class="cta-btn gs-btn gs-btn-secondary gs-btn-full" style="margin-top:10px;" aria-label="Abrir carteira: extrato e saque">
            Carteira · Extrato e Saque
        </a>
    </div>

<script src="../js/api.js"></script>
<script>
    if (!Auth.require()) throw new Error('unauthenticated');
    checkLGPDConsent();

    var user = Auth.getUser();
    var saldoTexto = fmtBRL(user ? user.saldo_centavos : 0);

    if (user) document.getElementById('userName').textContent = user.nome;

    // Atualiza ícone do olho e texto do saldo conforme privacidade
    function atualizarSaldo() {
        var saldoEl = document.getElementById('userSaldo');
        saldoEl.textContent = Privacy.isHidden() ? 'R$ •••' : saldoTexto;
        document.getElementById('eyeIcon').textContent = Privacy.isHidden() ? '🙈' : '👁';
    }

    document.getElementById('saldoToggleBtn').addEventListener('click', function() { Privacy.toggle(); });
    atualizarSaldo();
    document.addEventListener('privacyChange', atualizarSaldo);

    // Saldo vem sempre do servidor (centavos)
    async function carregarSaldo() {
        try {
            var resp = await API.carteira();
            saldoTexto = fmtBRL(resp.data.saldo_centavos);
            var u = Auth.getUser() || {};
            u.saldo_centavos = resp.data.saldo_centavos;
            Auth.saveUser(u);
            atualizarSaldo();
        } catch (e) { /* mantém o valor em cache */ }
    }

    // Contadores: desafios ativos (aberto / em andamento / em votação) e amigos aceitos
    async function carregarStats() {
        var ativos = ['aberto', 'em_andamento', 'em_votacao'];
        try {
            var respDesafios = await API.listarMeusDesafios('', 1, 100);
            var itens = (respDesafios.data && respDesafios.data.itens) || [];
            document.getElementById('statDesafiosVal').textContent =
                itens.filter(function(d) { return ativos.indexOf(d.status) >= 0; }).length;
        } catch (e) {
            document.getElementById('statDesafiosVal').textContent = '–';
        }

        try {
            var respAmigos = await API.listarAmigos();
            var amigos = (respAmigos.data || []).filter(function(a) { return a.status === 'aceita'; });
            document.getElementById('statAmigosVal').textContent = amigos.length;
        } catch (e) {
            document.getElementById('statAmigosVal').textContent = '–';
        }
    }

    carregarSaldo();
    carregarStats();
    renderBottomNav('/menu');
</script>
</body>
</html>
