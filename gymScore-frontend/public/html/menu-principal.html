<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feed — GymScore</title>
    <link rel="icon" type="image/svg+xml" href="/img/favicon.svg">
    <link rel="stylesheet" href="../css/base.css">
    <style>
        .feed-page { max-width: 640px; margin: 0 auto; padding: 0 0 24px; }

        .feed-header { padding: 20px 20px 0; background: linear-gradient(180deg, var(--accent-glow) 0%, transparent 100%); }
        .feed-header-row1 { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
        .feed-saudacao { font-size: var(--fs-xs); color: var(--text-muted); text-transform: uppercase; letter-spacing: .08em; }
        .feed-nome { font-size: 1.6rem; font-weight: 800; letter-spacing: .02em; line-height: 1.1; overflow-wrap: anywhere; }
        .feed-avatar { width: 44px; height: 44px; border-radius: 50%; background: var(--accent); color: var(--on-accent);
            display: flex; align-items: center; justify-content: center; font-size: 1.3rem; font-weight: 800; flex-shrink: 0; }
        .feed-saldo-row { display: flex; align-items: center; gap: 4px; margin-bottom: 10px; }
        .feed-saldo-link { color: var(--text); text-decoration: none; font-size: 1.9rem; font-weight: 800; min-height: var(--alvo); display: inline-flex; align-items: center; }
        .feed-eye-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; min-width: var(--alvo); min-height: var(--alvo); display: flex; align-items: center; justify-content: center; }
        .feed-elo-row { margin-bottom: 16px; }

        .feed-ctas { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 0 20px; margin-bottom: 16px; }
        .feed-ctas .gs-btn { padding: 10px 4px; font-size: .8rem; white-space: normal; text-align: center; }

        .onboarding { margin: 0 20px 16px; padding: 16px; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); }
        .onboarding h2 { font-size: 1rem; margin-bottom: 4px; }
        .onboarding > p { font-size: .85rem; color: var(--text-muted); margin-bottom: 10px; }
        .onboarding ol { list-style: none; display: grid; gap: 8px; }
        .onboarding li { display: flex; align-items: center; gap: 10px; font-size: .9rem; }
        .onboarding .passo { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--border); flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: .75rem; font-weight: 800; }
        .onboarding li.feito .passo { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
        .onboarding li.feito span:last-child { color: var(--text-muted); text-decoration: line-through; }
        .onboarding a { color: var(--accent); font-weight: 600; min-height: var(--alvo); display: inline-flex; align-items: center; }

        .feed-search { padding: 0 20px; margin-bottom: 12px; }
        .feed-search .gs-input { background: var(--bg-card); border-radius: 30px; }
        .chips-scroll { display: flex; gap: 8px; overflow-x: auto; padding: 0 20px 8px; scrollbar-width: none; margin-bottom: 8px; }
        .chips-scroll::-webkit-scrollbar { display: none; }
        .chips-scroll .chip-categoria { flex-shrink: 0; }

        .feed-section { padding: 0 20px; }
        .feed-section-title { font-size: .8rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 12px; }

        .recom-carousel { display: flex; gap: 12px; overflow-x: auto; padding: 0 20px 8px; scrollbar-width: none; margin-bottom: 20px; }
        .recom-carousel::-webkit-scrollbar { display: none; }
        .recom-card { flex-shrink: 0; width: 248px; max-width: 80vw; display: flex; flex-direction: column; color: inherit; text-decoration: none; background: var(--bg-card);
            border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; transition: border-color .2s; }
        .recom-card:hover { border-color: var(--accent); }
        .recom-titulo { font-weight: 600; font-size: .9rem; margin-bottom: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .recom-valor { color: var(--success-text); font-size: .82rem; font-weight: 700; margin-bottom: 6px; }
        .recom-razao { font-size: .8rem; color: var(--text); line-height: 1.45; overflow-wrap: anywhere; }
        .recom-por-que { display: block; font-size: .68rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 2px; }
        .recom-selo { display: inline-block; margin-left: 6px; padding: 0 6px; border-radius: 10px; border: 1px solid var(--accent); color: var(--accent); font-size: .62rem; letter-spacing: .04em; }
        .recom-base { list-style: none; display: flex; flex-wrap: wrap; gap: 4px; margin-top: auto; padding-top: 10px; }
        .recom-base li { font-size: .68rem; color: var(--text-muted); background: var(--bg-surface); border-radius: 10px; padding: 1px 7px; white-space: nowrap; }
        .recom-base-rot { flex-basis: 100%; background: none !important; padding: 0 !important; text-transform: uppercase; letter-spacing: .06em; font-weight: 700; }
        .recom-explica { font-size: .78rem; color: var(--text-muted); margin: -6px 0 10px; }
        .recom-explica a { color: var(--accent); }
        .recom-carousel .gs-skeleton { flex-shrink: 0; width: 248px; max-width: 80vw; margin: 0; }

        .desafios-lista { display: flex; flex-direction: column; gap: 14px; padding: 0 20px; }
        .lista-mais { text-align: center; margin: 16px 0 0; }
        .feed-estado { padding: 0 20px; }

        @media (min-width: 900px) {
            .feed-page { max-width: 900px; }
            .desafios-lista { display: grid; grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>
<body>

<main class="feed-page">
    <header class="feed-header">
        <div class="feed-header-row1">
            <div>
                <div class="feed-saudacao">Olá,</div>
                <div class="feed-nome" id="feedNome">...</div>
            </div>
            <div class="feed-avatar" id="feedAvatar" aria-hidden="true">?</div>
        </div>

        <div class="feed-saldo-row">
            <a class="feed-saldo-link" id="feedSaldo" href="/carteira" aria-label="Abrir carteira">R$ –</a>
            <button type="button" class="feed-eye-btn" id="btnOlho" aria-label="Mostrar ou ocultar saldo" aria-pressed="false">
                <svg id="saldoEyeIcon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"></svg>
            </button>
        </div>

        <div class="feed-elo-row">
            <span class="elo-badge elo-iniciante" id="feedEloBadge">INICIANTE • 0 XP</span>
        </div>
    </header>

    <nav class="feed-ctas" aria-label="Atalhos">
        <a href="/depositar" class="gs-btn gs-btn-primary">Depositar</a>
        <a href="/carteira" class="gs-btn gs-btn-secondary">Carteira</a>
        <a href="/desafios?aba=meus" class="gs-btn gs-btn-secondary">Meus desafios</a>
        <a href="/treinos" class="gs-btn gs-btn-secondary">Treinos</a>
    </nav>

    <section id="onboarding" class="onboarding" aria-labelledby="onbTitulo" hidden></section>

    <div class="feed-search">
        <input type="search" class="gs-input" id="buscaInput" placeholder="Buscar por título, local ou academia"
               aria-label="Buscar desafios" maxlength="100" autocomplete="off">
    </div>

    <div class="chips-scroll" id="chips" role="group" aria-label="Filtrar por categoria"></div>

    <div class="feed-section">
        <div class="feed-section-title" id="recomTitulo">Sugeridos para você</div>
        <p class="recom-explica" id="recomExplica">Escolhidos pelo seu Nível GymScore e pelos seus gráficos de atributos e categorias. <a href="/perfil#nivel">Ver meus gráficos</a></p>
    </div>
    <div class="recom-carousel" id="recomCarousel" aria-labelledby="recomTitulo"></div>

    <div class="feed-section">
        <div class="feed-section-title" id="desafiosTitulo">Desafios abertos</div>
    </div>
    <div class="feed-estado" id="feedEstado"></div>
    <div class="desafios-lista" id="desafiosLista"></div>
    <div class="lista-mais" id="listaMais" hidden>
        <button type="button" class="gs-btn gs-btn-secondary" id="btnMais">Carregar mais</button>
    </div>
</main>

<script src="../js/api.js"></script>
<script src="/js/paginas/menu-principal.js"></script>
</body>
</html>
