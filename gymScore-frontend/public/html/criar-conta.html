<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GymScore — Cadastro de Atleta</title>
    <link rel="icon" type="image/svg+xml" href="/img/favicon.svg">
    <link rel="stylesheet" href="../css/base.css">
    <style>

        .page {
            max-width: 480px;
            margin: 0 auto;
            padding: 24px 20px 48px;
        }

        /* Header voltar */
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--accent);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin-bottom: 24px;
        }

        /* Título */
        .page-title {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 2.4rem;
            letter-spacing: 0.04em;
            line-height: 1;
            margin-bottom: 6px;
        }
        .page-title .part-accent { color: var(--accent); }
        .page-subtitle {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 28px;
        }

        /* Cards de seção */
        .section-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 16px;
        }
        .section-card-title {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 16px;
        }

        /* Seleção de gênero em pills */
        .genero-pills {
            display: flex;
            gap: 8px;
        }
        .genero-pill {
            flex: 1;
            padding: 10px 4px;
            border: 1.5px solid var(--border);
            border-radius: 20px;
            background: transparent;
            color: var(--text-muted);
            font-family: inherit;
            font-size: 0.84rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .genero-pill.selecionado {
            border-color: var(--accent);
            background: var(--accent-glow);
            color: var(--accent);
        }

        /* Senha com contador */
        .senha-wrap { position: relative; }
        .senha-wrap .gs-input { padding-right: 52px; }
        .senha-counter {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 0.72rem;
            color: var(--text-muted);
            pointer-events: none;
        }
        .senha-counter.ok { color: var(--accent); }

        /* Card destaque elo */
        .elo-inicial-card {
            background: var(--bg-card);
            border: 1px solid var(--accent);
            border-left: 4px solid var(--accent);
            border-radius: var(--radius);
            padding: 16px 20px;
            margin-bottom: 20px;
        }
        .elo-inicial-title {
            font-size: 0.82rem;
            font-weight: 800;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin-bottom: 6px;
        }
        .elo-inicial-desc {
            font-size: 0.82rem;
            color: var(--text-muted);
            line-height: 1.5;
        }

        /* Botão criar conta */
        .btn-criar {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 30px;
            background: var(--accent);
            color: var(--on-accent);
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }
        .btn-criar:active { transform: scale(0.98); }
        .btn-criar:disabled { opacity: 0.55; cursor: not-allowed; }
    </style>
</head>
<body data-perfil="atleta">

<div class="page">
    <a href="/login" class="back-link" aria-label="Voltar para o login">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"/>
        </svg>
        VOLTAR
    </a>

    <h1 class="page-title">
        <span class="part-accent">CADASTRO</span> / <span>DE ATLETA</span>
    </h1>
    <p class="page-subtitle">Crie sua conta e comece a competir</p>

    <!-- Card dados pessoais -->
    <div class="section-card">
        <div class="section-card-title">Dados Pessoais</div>

        <div class="gs-field">
            <label class="gs-label" for="nome">Nome</label>
            <input type="text" id="nome" class="gs-input" placeholder="Seu nome" required autocomplete="given-name">
        </div>

        <div class="gs-field">
            <label class="gs-label" for="sobrenome">Sobrenome</label>
            <input type="text" id="sobrenome" class="gs-input" placeholder="Seu sobrenome" required autocomplete="family-name">
        </div>

        <div class="gs-field">
            <label class="gs-label" for="email">E-mail</label>
            <input type="email" id="email" class="gs-input" placeholder="email@exemplo.com" required autocomplete="email">
        </div>

        <div class="gs-field">
            <label class="gs-label" for="cpf">CPF</label>
            <input type="text" id="cpf" class="gs-input" data-mask="cpf" placeholder="000.000.000-00" required aria-required="true">
        </div>

        <div class="gs-field">
            <label class="gs-label" for="dataNasc">Data de Nascimento</label>
            <input type="date" id="dataNasc" class="gs-input" required style="color-scheme:dark;" autocomplete="bday">
        </div>

        <div class="gs-field">
            <label class="gs-label" id="generoLabel">Gênero</label>
            <div class="genero-pills" role="group" aria-labelledby="generoLabel">
                <button type="button" class="genero-pill" data-val="M" aria-pressed="false">Masculino</button>
                <button type="button" class="genero-pill" data-val="F" aria-pressed="false">Feminino</button>
                <button type="button" class="genero-pill" data-val="O" aria-pressed="false">Outro</button>
            </div>
            <input type="hidden" id="genero" value="">
        </div>

        <div class="gs-field">
            <label class="gs-label" for="senha">Senha <span style="font-weight:400;text-transform:none;">(mín. 8 caracteres)</span></label>
            <div class="senha-wrap">
                <input type="password" id="senha" class="gs-input" placeholder="••••••••"
                       minlength="8" required autocomplete="new-password">
                <span class="senha-counter" id="senhaCounter">0/8</span>
            </div>
            <label style="display:flex;align-items:center;gap:8px;margin-top:8px;font-size:.85rem;color:var(--text-muted);min-height:var(--alvo);">
                <input type="checkbox" id="verSenha" style="width:auto;"> Mostrar senha
            </label>
        </div>
    </div>

    <!-- Card elo inicial -->
    <div class="elo-inicial-card">
        <div class="elo-inicial-title">ELO INICIAL: INICIANTE</div>
        <p class="elo-inicial-desc">
            Sua carteira digital será criada automaticamente.
            Você já poderá se inscrever em desafios e acumular XP para subir de elo!
        </p>
    </div>

    <p id="errorMsg" class="gs-msg error" style="margin-bottom:14px;" role="alert"></p>

    <button type="button" class="btn-criar" id="btnCriar">
        CRIAR CONTA E COMPETIR
    </button>

    <p style="text-align:center;margin-top:16px;font-size:0.82rem;color:var(--text-muted);">
        Já tem conta? <a href="/login" style="color:var(--accent);font-weight:600;">Entrar</a>
    </p>
</div>

<script src="../js/api.js"></script>
<script src="/js/paginas/criar-conta.js"></script>
</body>
</html>
