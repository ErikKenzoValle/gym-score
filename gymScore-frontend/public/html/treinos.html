<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Treinos - GymScore</title>
    <link rel="icon" type="image/svg+xml" href="/img/favicon.svg">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/treinos.css">
    <style>
        .treinos-page { max-width: 720px; margin: 0 auto; padding: 16px 14px 90px; }
        .treinos-top { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:18px; flex-wrap:wrap; }
        .treinos-top h1 { font-size:1.4rem; margin:0; }
        .treinos-top .actions { display:flex; gap:8px; }

        /* Radar */
        .radar-card { background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius); padding:16px; margin-bottom:22px; text-align:center; }
        .radar-card h2 { font-size:1rem; margin:0 0 4px; }
        .radar-card p.sub { font-size:0.8rem; color:var(--text-muted); margin:0 0 10px; }
        .radar-svg { width:100%; max-width:340px; height:auto; }

        /* Lista de treinos */
        .treino-card { background:var(--bg-surface); border:1px solid var(--border); border-radius:var(--radius-sm); padding:16px; margin-bottom:12px; }
        .treino-card h3 { margin:0 0 4px; color:var(--primary); font-size:1.05rem; }
        .treino-card .meta { font-size:0.82rem; color:var(--text-muted); margin-bottom:12px; }
        .treino-card .treino-actions { display:flex; gap:8px; flex-wrap:wrap; }
        .treino-actions button { flex:1; min-width:90px; padding:9px 10px; font-size:0.85rem; border:none; border-radius:var(--radius-sm); font-weight:600; font-family:inherit; cursor:pointer; }
        .btn-exec { background:var(--primary); color:var(--on-accent); }
        .btn-share { background:var(--bg-card); color:var(--text); border:1px solid var(--border) !important; }
        .btn-del  { background:rgba(231,76,60,0.12); color:#F1948A; border:1px solid rgba(231,76,60,0.3) !important; }

        .empty-treinos { text-align:center; padding:40px 20px; color:var(--text-muted); }
        .empty-treinos .big { font-size:3rem; margin-bottom:10px; }

        /* Catálogo de exercícios no criar */
        .cat-grupo { margin-bottom:10px; border:1px solid var(--border); border-radius:var(--radius-sm); overflow:hidden; }
        .cat-grupo summary { padding:10px 12px; cursor:pointer; font-weight:600; background:var(--bg-surface); user-select:none; }
        .cat-grupo .cat-items { padding:8px 12px; display:flex; flex-wrap:wrap; gap:6px; }
        .cat-chip { padding:6px 10px; border:1px solid var(--border); border-radius:16px; font-size:0.8rem; cursor:pointer; background:var(--bg-card); color:var(--text); transition:all .15s; }
        .cat-chip.sel { background:var(--primary-glow); border-color:var(--primary); color:var(--primary); font-weight:600; }
        .sel-count { font-size:0.85rem; color:var(--text-muted); margin:8px 0 14px; }

        /* Modo guiado */
        .guia-progress-wrap { background:var(--bg-surface); border-radius:20px; height:10px; overflow:hidden; margin:12px 0 6px; }
        .guia-progress-bar { height:100%; background:var(--primary); width:0%; transition:width .3s; }
        .guia-progress-txt { font-size:0.8rem; color:var(--text-muted); text-align:center; margin-bottom:18px; }
        .guia-ex { text-align:center; padding:24px 12px; }
        .guia-ex .grupo-tag { display:inline-block; padding:4px 12px; border-radius:14px; background:var(--primary-glow); color:var(--primary); font-size:0.78rem; font-weight:700; text-transform:uppercase; letter-spacing:.04em; margin-bottom:14px; }
        .guia-ex .nome { font-size:1.6rem; font-weight:800; margin:0 0 6px; }
        .guia-ex .passo { font-size:0.85rem; color:var(--text-muted); }
        .guia-done { text-align:center; padding:30px 12px; }
        .guia-done .big { font-size:3.4rem; }
    </style>
</head>
<body>
<main class="treinos-page">
    <a class="gs-voltar" href="/menu">&larr; Voltar</a>
    <div class="treinos-top">
        <h1>Meus Treinos</h1>
        <div class="actions">
            <button type="button" class="gs-btn gs-btn-secondary" style="padding:8px 12px;font-size:0.85rem;" id="btnImportar">Importar</button>
            <button type="button" class="gs-btn gs-btn-primary" style="padding:8px 12px;font-size:0.85rem;" id="btnCriar">+ Criar</button>
        </div>
    </div>

    <!-- Radar de grupos musculares -->
    <div class="radar-card">
        <h2>Equilíbrio do treino</h2>
        <p class="sub">Quanto você treinou cada parte do corpo</p>
        <svg id="radarSvg" class="radar-svg" viewBox="0 0 320 300" role="img" aria-label="Radar de grupos musculares treinados"></svg>
    </div>

    <div id="statusTreinos" aria-live="polite"></div>
    <div id="treinosList"></div>

</main>

<!-- Modal: Criar treino -->
<div id="modalCriar" class="gs-modal-overlay" hidden>
    <div class="gs-modal" role="dialog" aria-labelledby="criarTitulo" style="max-width:520px;">
        <button type="button" class="gs-modal-x" style="position:absolute;top:12px;right:16px;" data-fechar="modalCriar" aria-label="Fechar">&times;</button>
        <h2 id="criarTitulo" style="margin-bottom:16px;font-size:1.2rem;">Criar Treino</h2>
        <div class="gs-field">
            <label class="gs-label" for="treinoNome">Nome do treino</label>
            <input type="text" id="treinoNome" class="gs-input" placeholder="Ex: Treino A - Peito e Tríceps">
        </div>
        <div class="gs-field" style="margin-top:10px;">
            <label class="gs-label" for="treinoDesc">Descrição (opcional)</label>
            <input type="text" id="treinoDesc" class="gs-input" placeholder="Ex: Foco em hipertrofia">
        </div>

        <p class="gs-label" style="margin:16px 0 8px;">Escolha os exercícios (na ordem que quiser fazer)</p>
        <div id="catalogo"></div>

        <p class="sel-count" id="selCount">0 exercícios selecionados</p>
        <p id="criarErro" class="gs-msg error" role="alert" style="display:none;margin-bottom:10px;"></p>
        <button type="button" class="gs-btn gs-btn-primary gs-btn-full" id="btnSalvar">Salvar Treino</button>
    </div>
</div>

<!-- Modal: Importar -->
<div id="modalImportar" class="gs-modal-overlay" hidden>
    <div class="gs-modal" role="dialog" aria-labelledby="importTitulo" style="max-width:520px;">
        <button type="button" class="gs-modal-x" style="position:absolute;top:12px;right:16px;" data-fechar="modalImportar" aria-label="Fechar">&times;</button>
        <h2 id="importTitulo" style="margin-bottom:16px;font-size:1.2rem;">Importar Treino</h2>
        <p style="font-size:0.88rem;color:var(--text-muted);margin-bottom:12px;">Cole o código que alguém compartilhou com você.</p>
        <input type="text" id="codigoImport" class="gs-input" placeholder="Ex: ABC123" aria-label="Código do treino" autocapitalize="characters" style="text-transform:uppercase;letter-spacing:0.1em;">
        <p id="importErro" class="gs-msg error" role="alert" style="display:none;margin:10px 0;"></p>
        <button type="button" class="gs-btn gs-btn-primary gs-btn-full" style="margin-top:14px;" id="btnConfirmarImport">Importar</button>
    </div>
</div>

<!-- Modal: Modo guiado -->
<div id="modalGuia" class="gs-modal-overlay" hidden>
    <div class="gs-modal" role="dialog" aria-labelledby="guiaTitulo" style="max-width:520px;">
        <button type="button" class="gs-modal-x" style="position:absolute;top:12px;right:16px;" id="guiaFechar" aria-label="Fechar">&times;</button>
        <h2 id="guiaTitulo" style="margin-bottom:16px;font-size:1.2rem;">Treino</h2>
        <div class="guia-progress-wrap"><div class="guia-progress-bar" id="guiaBar"></div></div>
        <div class="guia-progress-txt" id="guiaProg" aria-live="polite">0 / 0</div>
        <div id="guiaConteudo"></div>
    </div>
</div>

<script src="../js/api.js"></script>
<script src="/js/paginas/treinos.js"></script>
</body>
</html>
