<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Acesso - GymScore</title>
    <link rel="icon" type="image/svg+xml" href="/img/favicon.svg">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/login.css">
    <style>
        .info-box { background:rgba(76,175,80,0.1); border:1px solid var(--success); border-radius:8px;
                    padding:14px; margin-bottom:20px; font-size:0.9em; color:#ccc; line-height:1.5; }
        .info-box strong { color:var(--success); }
    </style>
</head>
<body>
    <div class="container">
        <h1>Recuperar Acesso</h1>

        <div class="info-box">
            <strong>Como funciona:</strong> informe o e-mail da sua conta. Se ele estiver cadastrado,
            enviaremos um link para você criar uma nova senha. O link vale por 30 minutos e só pode ser usado uma vez.
        </div>

        <form id="recoverForm">
            <div class="input-group">
                <label for="email">E-mail cadastrado</label>
                <input type="email" id="email" required placeholder="seu@email.com" autocomplete="email">
            </div>
            <p id="errorMsg" style="color:#e74c3c;display:none;" role="alert"></p>
            <p id="successMsg" style="color:var(--success-text);display:none;" role="status"></p>
            <input type="submit" value="Enviar link de recuperação">
        </form>

        <div class="signup-link">
            <p>Lembrou a senha? <a href="/login">Fazer login</a></p>
        </div>
    </div>

<script src="../js/api.js"></script>
<script src="/js/paginas/esqueci-senha.js"></script>
</body>
</html>
