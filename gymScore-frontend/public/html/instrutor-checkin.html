<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check-in — GymScore</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/instrutor.css">
    <style>
        /* Input de arquivo oculto para fallback QR */
        #qrFileInput { display: none; }
    </style>
</head>
<body data-perfil="instrutor">

<div class="page">
    <a href="/instrutor" class="back-link" aria-label="Voltar para agenda">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"/>
        </svg>
        AGENDA
    </a>

    <h1 class="page-title" id="eventoTitulo">CHECK-IN</h1>

    <!-- KPIs -->
    <div class="kpi-grid-3">
        <div class="kpi-card">
            <div class="kpi-label">Inscritos</div>
            <div class="kpi-value" id="kpiInscritos">–</div>
        </div>
        <div class="kpi-card">
            <div class="kpi-label">Presentes</div>
            <div class="kpi-value" id="kpiPresentes">–</div>
        </div>
        <div class="kpi-card">
            <div class="kpi-label">Aguardando</div>
            <div class="kpi-value" id="kpiAguardando">–</div>
        </div>
    </div>

    <!-- Escanear QR -->
    <button class="btn-scan" onclick="iniciarScan()" aria-label="Escanear QR Code">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
             aria-hidden="true">
            <polyline points="23 4 23 8 19 8"/>
            <polyline points="1 20 1 16 5 16"/>
            <path d="M3.51 9a9 9 0 0114.85-3.36L23 10"/>
            <path d="M20.49 15a9 9 0 01-14.85 3.36L1 14"/>
        </svg>
        ESCANEAR QR CODE
    </button>
    <!-- Fallback: input de arquivo para dispositivos sem BarcodeDetector -->
    <input type="file" id="qrFileInput" accept="image/*" onchange="processarImagem(this)">
    <div id="scanMsg" class="gs-msg" style="margin-bottom:12px;"></div>

    <!-- Lista de atletas -->
    <div class="section-title" id="listaTitle">LISTA DE ATLETAS</div>
    <div id="loadMsg" class="gs-msg"></div>
    <div id="atletas-lista" aria-live="polite"></div>

    <!-- Botão ir para pódio -->
    <a id="btnPodio" href="#" class="btn-podio" aria-label="Ir para lançamento do pódio">
        IR PARA LANÇAMENTO DO PÓDIO →
    </a>
</div>

<script src="../js/api.js"></script>
<script>
    if (!Auth.require()) throw new Error('unauthenticated');

    var user = Auth.getUser();
    if (user && user.perfil !== 'instrutor') {
        window.location.href = user.perfil === 'academia' ? '/academia' : '/menu';
        throw new Error('perfil não autorizado');
    }
    document.body.dataset.perfil = 'instrutor';

    var idDesafio = new URLSearchParams(location.search).get('id');
    if (!idDesafio) window.location.href = '/instrutor';

    document.getElementById('btnPodio').href = '/instrutor/podio?id=' + idDesafio;

    var _participantes = [];
    var _presentes     = new Set();

    function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

    // ── Carrega info do evento ────────────────────────────────────────────────
    async function carregarInfoEvento() {
        try {
            var resp  = await API.listarDesafios();
            var lista = resp.data || [];
            var des   = lista.find(function(d){ return String(d.id) === String(idDesafio); });
            if (des) document.getElementById('eventoTitulo').textContent = des.titulo.toUpperCase();
        } catch(e) { /* silencioso */ }
    }

    // ── Carrega lista de participantes e presentes ────────────────────────────
    async function carregarLista() {
        var loadMsg = document.getElementById('loadMsg');
        loadMsg.className = 'gs-msg show';
        loadMsg.textContent = 'Carregando atletas...';

        try {
            var resp = await API.listarPresentes(idDesafio);
            var dados = resp.data || [];

            // Separa participantes e presentes
            _participantes = dados;
            _presentes = new Set(dados.filter(function(p){ return p.presente; }).map(function(p){ return p.id_usuario; }));

            loadMsg.classList.remove('show');
            renderLista();
        } catch(err) {
            loadMsg.className = 'gs-msg error show';
            loadMsg.textContent = err.message;
        }
    }

    function renderLista() {
        var total     = _participantes.length;
        var presentes = _presentes.size;
        var aguardando = total - presentes;

        document.getElementById('kpiInscritos').textContent  = total;
        document.getElementById('kpiPresentes').textContent  = presentes;
        document.getElementById('kpiAguardando').textContent = aguardando;
        document.getElementById('listaTitle').textContent    = 'LISTA DE ATLETAS (' + total + ')';

        var container = document.getElementById('atletas-lista');
        container.innerHTML = '';

        if (total === 0) {
            container.innerHTML = '<p style="color:var(--text-muted);font-size:.85rem;padding:16px 0;">Nenhum atleta inscrito.</p>';
            return;
        }

        _participantes.forEach(function(p, idx) {
            var u         = p.usuario || {};
            var nome      = esc(((u.nome || '') + ' ' + (u.sobrenome || '')).trim() || ('Atleta #' + p.id_usuario));
            var ePresente = _presentes.has(p.id_usuario);
            var elo       = u.elo || 'Iniciante';
            var eloClass  = { Bronze:'elo-bronze', Prata:'elo-prata', Ouro:'elo-ouro', Diamante:'elo-diamante', Elite:'elo-elite', Iniciante:'elo-iniciante' }[elo] || 'elo-iniciante';

            var div = document.createElement('div');
            div.className = 'atleta-item';
            div.id = 'atleta-' + p.id_usuario;
            div.innerHTML =
                '<div class="atleta-status-dot ' + (ePresente ? 'presente' : 'aguardando') + '"></div>' +
                '<span class="atleta-num">' + (idx+1) + '</span>' +
                '<div class="atleta-info">' +
                    '<div class="atleta-nome">' + nome + '</div>' +
                    '<span class="elo-badge ' + eloClass + '" style="margin-top:3px;">' + esc(elo) + '</span>' +
                '</div>' +
                '<div class="atleta-actions">' +
                    '<span class="' + (ePresente ? 'badge-presente' : 'badge-registrado') + '" id="badge-' + p.id_usuario + '">' +
                        (ePresente ? 'PRESENTE' : 'REGISTRADO') +
                    '</span>' +
                    (!ePresente ?
                        '<button class="btn-marcar" id="btn-mark-' + p.id_usuario + '" ' +
                            'onclick="marcarPresente(' + p.id_usuario + ', this)" ' +
                            'aria-label="Marcar presença de ' + nome + '">✓</button>'
                    : '') +
                '</div>';

            container.appendChild(div);
        });
    }

    // ── Marcar presença manual ────────────────────────────────────────────────
    async function marcarPresente(idUsuario, btn) {
        btn.disabled = true;
        try {
            await API.marcarPresenca(idDesafio, idUsuario);
            _presentes.add(idUsuario);

            // Atualiza badge e dot sem re-renderizar a lista toda
            var badge = document.getElementById('badge-' + idUsuario);
            if (badge) {
                badge.className = 'badge-presente';
                badge.textContent = 'PRESENTE';
            }
            var dot = document.querySelector('#atleta-' + idUsuario + ' .atleta-status-dot');
            if (dot) { dot.className = 'atleta-status-dot presente'; }
            btn.style.display = 'none';

            // Atualiza KPIs
            var presentes  = _presentes.size;
            var aguardando = _participantes.length - presentes;
            document.getElementById('kpiPresentes').textContent  = presentes;
            document.getElementById('kpiAguardando').textContent = aguardando;

            showToast('Presença registrada!', 'success');
        } catch(err) {
            showToast(err.message, 'error');
            btn.disabled = false;
        }
    }

    // ── Scan QR ────────────────────────────────────────────────────────────────
    async function iniciarScan() {
        // Tenta BarcodeDetector API
        if ('BarcodeDetector' in window) {
            try {
                var detector = new BarcodeDetector({ formats: ['qr_code'] });
                var stream   = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                var video    = document.createElement('video');
                video.srcObject = stream;
                video.play();

                var scanInterval = setInterval(async function() {
                    try {
                        var barcodes = await detector.detect(video);
                        if (barcodes.length > 0) {
                            clearInterval(scanInterval);
                            stream.getTracks().forEach(function(t){ t.stop(); });
                            processarCodigo(barcodes[0].rawValue);
                        }
                    } catch(e) { /* aguarda próximo frame */ }
                }, 300);

                showToast('Aponte a câmera para o QR Code', '');
                return;
            } catch(e) {
                // Câmera não disponível, usa fallback
            }
        }
        // Fallback: upload de imagem
        document.getElementById('qrFileInput').click();
    }

    function processarImagem(input) {
        if (!input.files || input.files.length === 0) return;
        // Sem biblioteca jsQR no escopo, informa o instrutor para usar o botão manual
        var scanMsg = document.getElementById('scanMsg');
        scanMsg.className = 'gs-msg error show';
        scanMsg.textContent = 'Leitura de imagem não suportada neste dispositivo. Use o botão manual.';
    }

    function processarCodigo(codigo) {
        // Formato esperado: AC-XXXX-YYY onde YYY é o ID do usuário
        var match = codigo.match(/\d+$/);
        if (!match) {
            showToast('QR Code inválido.', 'error');
            return;
        }
        var idUsuario = parseInt(match[0]);
        var atleta    = _participantes.find(function(p){ return p.id_usuario === idUsuario; });
        if (!atleta) {
            showToast('Atleta não encontrado na lista.', 'error');
            return;
        }
        if (_presentes.has(idUsuario)) {
            showToast('Atleta já marcado como presente.', '');
            return;
        }
        // Marca via API
        var btn = document.getElementById('btn-mark-' + idUsuario);
        if (btn) marcarPresente(idUsuario, btn);
    }

    carregarInfoEvento();
    carregarLista();
    renderBottomNav('/instrutor/checkin');
</script>
</body>
</html>
