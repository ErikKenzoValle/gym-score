<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0D1117">
    <title>Desafios - GymScore</title>
    <link rel="icon" type="image/svg+xml" href="/img/favicon.svg">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/desafios.css">
</head>
<body>
<main class="desafios-page">
    <div class="desafios-topo">
        <h1>Desafios</h1>
        <div class="desafios-busca">
            <input type="search" class="gs-input" id="buscaInput" placeholder="Buscar por título, local ou academia"
                   aria-label="Buscar desafio por título, local ou academia" maxlength="100" autocomplete="off">
            <button type="button" class="limpar" id="limparBusca" aria-label="Limpar busca" hidden>&#10005;</button>
        </div>
    </div>

    <div class="gs-tabs" role="tablist" aria-label="Lista de desafios">
        <button type="button" class="gs-tab active" id="tabExplorar" role="tab" aria-selected="true" aria-controls="painelLista">Explorar</button>
        <button type="button" class="gs-tab" id="tabMeus" role="tab" aria-selected="false" aria-controls="painelLista" tabindex="-1">Meus desafios</button>
    </div>

    <div class="filtros-linha" id="filtros" role="group" aria-label="Filtros"></div>

    <div class="ordenacao" id="ordenacao" hidden>
        <label for="ordem">Ordenar por</label>
        <select id="ordem">
            <option value="data">Data do evento</option>
            <option value="valor_asc">Menor entrada</option>
            <option value="valor_desc">Maior entrada</option>
            <option value="proximidade">Mais próximos</option>
        </select>
    </div>

    <div id="aviso"></div>

    <section id="painelLista" role="tabpanel" aria-labelledby="tabExplorar">
        <div id="estado"></div>
        <div id="grade" class="desafios-grade"></div>
        <div class="lista-mais" id="listaMais" hidden>
            <button type="button" class="gs-btn gs-btn-secondary" id="btnMais">Carregar mais</button>
        </div>
    </section>
</main>

<!-- Detalhe do desafio (Modal.abrir) -->
<div id="detalheModal" class="gs-modal-overlay" hidden>
    <div class="gs-modal largo" role="dialog" aria-labelledby="detalheTitulo" id="detalheConteudo"></div>
</div>

<script src="../js/api.js"></script>
<script src="/js/paginas/desafios-detalhado.js"></script>
</body>
</html>
