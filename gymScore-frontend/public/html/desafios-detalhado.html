<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio — GymScore</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/base.css">
    <style>
        body { background: #0a0a0f; padding-bottom: 90px; }

        /* ─── Imagem de capa ─────────────────────────────────────────── */
        .capa-wrap {
            position: relative;
            width: 100%;
            height: 200px;
        }
        .capa-img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
        }
        .capa-gradient {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 120px;
            background: linear-gradient(180deg, transparent 0%, #0a0a0f 100%);
        }
        .capa-back {
            position: absolute;
            top: 14px;
            left: 14px;
            background: rgba(0,0,0,0.55);
            border: none;
            border-radius: 20px;
            color: #fff;
            padding: 6px 14px;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            text-decoration: none;
            backdrop-filter: blur(6px);
        }
        .capa-cat {
            position: absolute;
            top: 14px;
            right: 14px;
        }

        /* ─── Conteúdo ───────────────────────────────────────────────── */
        .detail-page {
            max-width: 480px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .detail-titulo {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 2.2rem;
            letter-spacing: 0.03em;
            color: var(--text);
            margin: 8px 0 16px;
            line-height: 1.05;
        }

        /* Row de 2 cards info */
        .info-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 14px;
        }
        .info-mini {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 14px;
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }
        .info-mini svg { flex-shrink: 0; margin-top: 2px; color: var(--accent); }
        .info-mini-label {
            font-size: 0.72rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin-bottom: 3px;
        }
        .info-mini-value {
            font-size: 0.88rem;
            font-weight: 600;
            color: var(--text);
        }

        /* Cards de seção */
        .detail-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px;
            margin-bottom: 12px;
        }
        .detail-card-title {
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 12px;
        }

        /* Distribuição de prêmios */
        .podio-list { list-style: none; }
        .podio-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
        }
        .podio-item:last-child { border-bottom: none; }
        .podio-medal { font-size: 1.4rem; width: 32px; text-align: center; }
        .podio-pos-label { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 2px; }
        .podio-valor { font-size: 1rem; font-weight: 700; color: var(--accent); }

        /* ─── Rodapé fixo ────────────────────────────────────────────── */
        .detail-footer {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: rgba(13,17,23,0.97);
            border-top: 1px solid var(--border);
            backdrop-filter: blur(12px);
            padding: 12px 20px;
            z-index: 50;
        }
        .detail-footer-inner {
            max-width: 480px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .footer-col {
            display: flex;
            flex-direction: column;
        }
        .footer-label {
            font-size: 0.65rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }
        .footer-value {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--accent);
        }
        .btn-garantir {
            margin-left: auto;
            padding: 12px 20px;
            background: var(--accent);
            color: #000;
            border: none;
            border-radius: 30px;
            font-family: inherit;
            font-size: 0.88rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            white-space: nowrap;
        }
        .btn-garantir:active { transform: scale(0.97); }
        .btn-garantir:disabled { opacity: 0.55; cursor: not-allowed; }

        /* Loading skeleton */
        .detail-skeleton {
            height: 24px;
            border-radius: 6px;
            background: linear-gradient(90deg,var(--bg-card) 25%,var(--bg-surface) 50%,var(--bg-card) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.4s infinite;
            margin-bottom: 8px;
        }
        @keyframes shimmer { 0%{background-position:-200% 0} 100%{background-position:200% 0} }
    </style>
</head>
<body>

<!-- Capa da imagem -->
<div class="capa-wrap" id="capaWrap">
    <img id="capaImg" src="../img/desafio-amigos.jpeg" alt="Capa do desafio" class="capa-img">
    <div class="capa-gradient"></div>
    <a href="/menu" class="capa-back" id="btnVoltar" aria-label="Voltar">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"/>
        </svg>
        VOLTAR
    </a>
    <div class="capa-cat" id="capaCat"></div>
</div>

<!-- Conteúdo -->
<div class="detail-page">
    <div id="loadingState">
        <div class="detail-skeleton" style="width:80%;height:32px;margin-top:12px;"></div>
        <div class="detail-skeleton" style="width:100%;height:60px;"></div>
        <div class="detail-skeleton" style="width:100%;height:100px;"></div>
    </div>

    <div id="conteudo" style="display:none;">
        <h1 class="detail-titulo" id="detTitulo"></h1>

        <!-- Cards: data e vagas -->
        <div class="info-row">
            <div class="info-mini">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                     fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="4" width="18" height="18" rx="2"/>
                    <line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/>
                    <line x1="3" y1="10" x2="21" y2="10"/>
                </svg>
                <div>
                    <div class="info-mini-label">Data</div>
                    <div class="info-mini-value" id="detData">—</div>
                </div>
            </div>
            <div class="info-mini">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                     fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/>
                    <circle cx="9" cy="7" r="4"/>
                    <path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/>
                </svg>
                <div>
                    <div class="info-mini-label">Vagas restantes</div>
                    <div class="info-mini-value" id="detVagas">—</div>
                </div>
            </div>
        </div>

        <!-- Local -->
        <div class="detail-card" id="cardLocal" style="display:none;">
            <div class="detail-card-title">Local do Evento</div>
            <div style="display:flex;align-items:flex-start;gap:10px;">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                     fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                     style="flex-shrink:0;margin-top:2px;">
                    <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/>
                    <circle cx="12" cy="10" r="3"/>
                </svg>
                <span id="detLocal" style="font-size:0.9rem;color:var(--text);"></span>
            </div>
        </div>

        <!-- Regras Técnicas -->
        <div class="detail-card" id="cardRegras" style="display:none;">
            <div class="detail-card-title">Regras Técnicas</div>
            <div id="detRegras" style="font-size:0.88rem;color:var(--text-muted);line-height:1.6;"></div>
        </div>

        <!-- Distribuição de Prêmios -->
        <div class="detail-card" id="cardPremio">
            <div class="detail-card-title">Distribuição de Prêmios</div>
            <ul class="podio-list" id="podioPremios"></ul>
        </div>

        <p id="detMsg" class="gs-msg" style="margin-bottom:12px;"></p>
    </div>
</div>

<!-- Rodapé fixo (acima do bottom nav) -->
<div class="detail-footer" id="detFooter" style="display:none;">
    <div class="detail-footer-inner">
        <div class="footer-col">
            <span class="footer-label">Taxa</span>
            <span class="footer-value" id="detTaxa">R$ —</span>
        </div>
        <div class="footer-col">
            <span class="footer-label">Elo Mín.</span>
            <span class="footer-value" id="detEloMin">—</span>
        </div>
        <button class="btn-garantir" id="btnGarantir" onclick="garantirVaga()">
            GARANTIR VAGA →
        </button>
    </div>
</div>

<script src="../js/api.js"></script>
<script>
    if (!Auth.require()) throw new Error('unauthenticated');

    var user      = Auth.getUser();
    var _desafio  = null;

    if (user) document.body.dataset.perfil = user.perfil || 'atleta';

    var params  = new URLSearchParams(location.search);
    var idDesafio = params.get('id');

    // Se veio com ?voltar= usa como destino do botão voltar
    var voltarDe = params.get('de') || '/menu';
    document.getElementById('btnVoltar').href = voltarDe;

    if (!idDesafio) {
        window.location.href = '/menu';
    }

    // Distribuição de prêmio padrão
    var _DISTRIB = [
        { pos: '1º lugar', pct: 60, medal: '🥇' },
        { pos: '2º lugar', pct: 25, medal: '🥈' },
        { pos: '3º lugar', pct: 10, medal: '🥉' },
        { pos: '4º lugar', pct: 5,  medal: '🏅' }
    ];

    async function carregarDesafio() {
        try {
            // Busca desafio na lista geral (sem endpoint específico de id)
            var resp = await API.listarDesafios();
            var lista = resp.data || [];
            _desafio  = lista.find(function(d) { return String(d.id) === String(idDesafio); });

            if (!_desafio) {
                document.getElementById('loadingState').innerHTML =
                    '<p style="color:var(--text-muted);padding:24px 0;">Desafio não encontrado.</p>';
                return;
            }

            renderDesafio(_desafio);
        } catch(e) {
            document.getElementById('loadingState').innerHTML =
                '<p style="color:#F1948A;padding:24px 0;">Erro ao carregar desafio.</p>';
        }
    }

    function renderDesafio(d) {
        document.title = d.titulo + ' — GymScore';

        // Categoria
        if (d.categoria) {
            document.getElementById('capaCat').innerHTML =
                '<span class="chip-categoria" style="font-size:.72rem;padding:4px 10px;">' + esc(d.categoria) + '</span>';
        }

        // Título
        document.getElementById('detTitulo').textContent = d.titulo;

        // Data
        var dtStr = '—';
        var dt = d.data_hora || d.data_encerramento;
        if (dt) dtStr = new Date(dt).toLocaleDateString('pt-BR', { day:'2-digit', month:'long', year:'numeric' });
        document.getElementById('detData').textContent = dtStr;

        // Vagas
        var inscritos = (d.participantes || []).length;
        var vagas     = d.vagas || d.limite_participantes || 0;
        document.getElementById('detVagas').textContent =
            vagas > 0 ? (vagas - inscritos) + ' de ' + vagas : '—';

        // Local
        if (d.local) {
            document.getElementById('detLocal').textContent = d.local;
            document.getElementById('cardLocal').style.display = 'block';
        }

        // Regras
        var desc = d.descricao || '';
        if (desc) {
            var regrasEl = document.getElementById('detRegras');
            var linhas   = desc.split(/\n/).filter(function(l){ return l.trim(); });
            if (linhas.length > 1) {
                regrasEl.innerHTML = '<ul style="list-style:disc;padding-left:18px;">' +
                    linhas.map(function(l){ return '<li>' + esc(l) + '</li>'; }).join('') + '</ul>';
            } else {
                regrasEl.textContent = desc;
            }
            document.getElementById('cardRegras').style.display = 'block';
        }

        // Prêmios
        var premioTotal = parseFloat(d.premio_total || d.valor || 0);
        var ul = document.getElementById('podioPremios');
        ul.innerHTML = '';
        _DISTRIB.forEach(function(p) {
            var valor = (premioTotal * p.pct / 100).toFixed(2).replace('.', ',');
            var li    = document.createElement('li');
            li.className = 'podio-item';
            li.innerHTML =
                '<span class="podio-medal">' + p.medal + '</span>' +
                '<div><div class="podio-pos-label">' + p.pos + ' (' + p.pct + '%)</div>' +
                '<div class="podio-valor">R$ ' + valor + '</div></div>';
            ul.appendChild(li);
        });

        // Footer
        var taxa = parseFloat(d.valor || 0).toFixed(2).replace('.', ',');
        var elo  = (d.elo_minimo || d.elo_min || 'Livre').toUpperCase();
        document.getElementById('detTaxa').textContent   = 'R$ ' + taxa;
        document.getElementById('detEloMin').textContent = elo;

        // Verifica se o usuário já participa
        var euParticipo = (d.participantes || []).some(function(p){ return p.id_usuario === user.id; });
        var lotado      = vagas > 0 && inscritos >= vagas;
        var btn = document.getElementById('btnGarantir');
        if (d.status !== 'aberto') {
            btn.disabled = true;
            btn.textContent = 'ENCERRADO';
        } else if (euParticipo) {
            btn.disabled = true;
            btn.textContent = 'JA INSCRITO ✓';
        } else if (lotado) {
            btn.disabled = true;
            btn.textContent = 'SEM VAGAS';
        }

        document.getElementById('loadingState').style.display = 'none';
        document.getElementById('conteudo').style.display = 'block';
        document.getElementById('detFooter').style.display = 'block';
    }

    async function garantirVaga() {
        var btn   = document.getElementById('btnGarantir');
        var msgEl = document.getElementById('detMsg');
        msgEl.classList.remove('show');
        if (!_desafio) return;
        btn.disabled = true;
        btn.textContent = '...';
        try {
            await API.aceitarDesafio(_desafio.id, user.id);
            btn.textContent = 'INSCRITO ✓';
            showToast('Vaga garantida! Boa sorte!', 'success');
        } catch(e) {
            msgEl.className = 'gs-msg error show';
            msgEl.textContent = e.message;
            btn.disabled = false;
            btn.textContent = 'GARANTIR VAGA →';
        }
    }

    function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

    carregarDesafio();
</script>
</body>
</html>
