<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extrato — GymScore</title>
    <link rel="icon" type="image/svg+xml" href="/img/favicon.svg">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/extrato.css">
</head>
<body>
<div class="extrato-page">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:4px;">
        <a href="/carteira" style="color:var(--text-muted);text-decoration:none;font-size:1.4rem;" aria-label="Voltar">←</a>
        <h1 style="font-size:1.3rem;">Extrato</h1>
    </div>
    <p style="color:var(--text-muted);font-size:0.85rem;margin-bottom:0;">Histórico de movimentações</p>

    <div class="extrato-totais">
        <div class="total-card entrada">
            <div class="total-label">Total entradas</div>
            <div class="total-value" id="totalEntradas">R$ –</div>
        </div>
        <div class="total-card saida">
            <div class="total-label">Total saídas</div>
            <div class="total-value" id="totalSaidas">R$ –</div>
        </div>
    </div>

    <p id="loadMsg" class="gs-msg" style="display:none;"></p>
    <ul class="tx-list" id="txList" aria-label="Lista de transações"></ul>
    <div class="empty-msg" id="emptyMsg" hidden>Nenhuma movimentação encontrada.</div>
</div>

<script src="../js/api.js"></script>
<script>
    if (!Auth.require()) throw new Error('unauthenticated');

    function fmtDate(d) {
        if (!d) return '';
        var s = String(d).replace('T', ' ').substring(0, 16);
        return s;
    }

    // Descrição amigável por tipo do ledger (/api/carteira/extrato)
    var _DESC_TIPO = {
        deposito: 'Depósito PIX',
        saque: 'Saque PIX',
        entrada_desafio: 'Entrada em desafio',
        premio_desafio: 'Prêmio de desafio',
        estorno_desafio: 'Estorno',
        ajuste: 'Ajuste'
    };

    async function carregarExtrato() {
        var loadMsg = document.getElementById('loadMsg');
        loadMsg.className = 'gs-msg'; loadMsg.textContent = 'Carregando...'; loadMsg.style.display = 'block';
        try {
            var resp = await API.extrato(1, 50);
            var d = resp.data || {};
            var lista = d.itens || [];

            var totalEntradas = 0, totalSaidas = 0;
            lista.forEach(function(tx) {
                if (tx.valor_centavos >= 0) totalEntradas += tx.valor_centavos;
                else totalSaidas += Math.abs(tx.valor_centavos);
            });
            document.getElementById('totalEntradas').textContent = fmtBRL(totalEntradas);
            document.getElementById('totalSaidas').textContent   = fmtBRL(totalSaidas);
            loadMsg.style.display = 'none';

            if (lista.length === 0) {
                document.getElementById('emptyMsg').hidden = false;
                return;
            }

            var ul = document.getElementById('txList');
            lista.forEach(function(tx) {
                var tipo  = tx.valor_centavos >= 0 ? 'entrada' : 'saida';
                var sinal = tipo === 'entrada' ? '+' : '-';
                var icone = tipo === 'entrada' ? '↓' : '↑';
                var desc  = tx.descricao || _DESC_TIPO[tx.tipo] || 'Movimentação';

                var li = document.createElement('li');
                li.className = 'tx-item';
                li.innerHTML =
                    '<div class="tx-icon ' + tipo + '">' + icone + '</div>' +
                    '<div class="tx-info">' +
                        '<div class="tx-desc">' + esc(desc) + '</div>' +
                        '<div class="tx-date">' + fmtDate(tx.criado_em) + '</div>' +
                    '</div>' +
                    '<div class="tx-valor ' + tipo + '">' + sinal + ' ' + fmtBRL(Math.abs(tx.valor_centavos)) + '</div>';
                ul.appendChild(li);
            });
        } catch (err) {
            loadMsg.className = 'gs-msg error'; loadMsg.textContent = err.message; loadMsg.style.display = 'block';
        }
    }

    function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

    carregarExtrato();
    renderBottomNav('/carteira');
</script>
</body>
</html>
