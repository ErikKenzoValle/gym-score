<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Perfil - GymScore</title>
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/alterar-perfil.css">
</head>
<body>
    <div class="edit-profile-container">
        <div class="gs-page-header" style="padding:0;margin-bottom:24px;">
            <h1>Editar Perfil</h1>
            <a href="/perfil" class="gs-btn gs-btn-secondary" style="padding:8px 16px;font-size:0.85rem;" aria-label="Voltar para o perfil">Voltar</a>
        </div>

        <form id="editProfileForm" onsubmit="submitForm(event)" novalidate>
            <div class="form-group">
                <label class="gs-label" for="nome">Nome</label>
                <input type="text" id="nome" name="nome" class="gs-input" required autocomplete="given-name" aria-required="true">
            </div>
            <div class="form-group">
                <label class="gs-label" for="sobrenome">Sobrenome</label>
                <input type="text" id="sobrenome" name="sobrenome" class="gs-input" required autocomplete="family-name" aria-required="true">
            </div>
            <div class="form-group">
                <label class="gs-label" for="genero">Gênero</label>
                <select id="genero" name="genero" class="gs-input" required aria-required="true">
                    <option value="M">Masculino</option>
                    <option value="F">Feminino</option>
                    <option value="O">Outro</option>
                </select>
            </div>

            <div id="formMsg" class="gs-msg" aria-live="polite" style="margin-bottom:16px;"></div>

            <div style="display:flex;gap:10px;">
                <button type="submit" id="submitBtn" class="gs-btn gs-btn-primary" style="flex:1;" aria-label="Salvar alterações do perfil">
                    Salvar Alterações
                </button>
                <a href="/perfil" class="gs-btn gs-btn-secondary" aria-label="Cancelar e voltar para o perfil">Cancelar</a>
            </div>
        </form>
    </div>

<script src="../js/api.js"></script>
<script>
    if (!Auth.require()) throw new Error('unauthenticated');

    var user = Auth.getUser();

    // Popula campos com os dados atuais do localStorage
    if (user) {
        document.getElementById('nome').value = user.nome || '';
        document.getElementById('sobrenome').value = user.sobrenome || '';
        var generoSel = document.getElementById('genero');
        for (var i = 0; i < generoSel.options.length; i++) {
            if (generoSel.options[i].value === user.genero) {
                generoSel.selectedIndex = i;
                break;
            }
        }
    }

    async function submitForm(event) {
        event.preventDefault();

        var msgEl   = document.getElementById('formMsg');
        var btn     = document.getElementById('submitBtn');
        var nome    = document.getElementById('nome').value.trim();
        var sobrenome = document.getElementById('sobrenome').value.trim();
        var genero  = document.getElementById('genero').value;

        msgEl.className = 'gs-msg';

        if (!nome || !sobrenome) {
            msgEl.className = 'gs-msg error show';
            msgEl.textContent = 'Nome e sobrenome são obrigatórios.';
            return;
        }

        btnLoading(btn, true);

        try {
            var resp = await API.atualizarPerfil({ nome: nome, sobrenome: sobrenome, genero: genero });
            var usuarioAtualizado = resp.data || {};

            // Atualiza localStorage mantendo campos que o backend não devolve (saldo, cpf, etc.)
            var userAtual = Auth.getUser() || {};
            var userMerged = Object.assign({}, userAtual, usuarioAtualizado);
            Auth.save(Auth.getToken(), userMerged);

            msgEl.className = 'gs-msg success show';
            msgEl.textContent = 'Perfil atualizado! Redirecionando...';

            setTimeout(function() {
                window.location.href = '/perfil';
            }, 1500);
        } catch (err) {
            msgEl.className = 'gs-msg error show';
            msgEl.textContent = err.message || 'Erro ao atualizar perfil.';
            btnLoading(btn, false);
        }
    }

    renderBottomNav('/perfil');
</script>
</body>
</html>
