<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Perfil - GymScore</title>
    <link rel="icon" type="image/svg+xml" href="/img/favicon.svg">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/alterar-perfil.css">
</head>
<body>
    <div class="edit-profile-container">
        <div class="gs-page-header" style="padding:0;margin-bottom:24px;">
            <h1>Editar Perfil</h1>
            <a href="/perfil" class="gs-btn gs-btn-secondary" style="padding:8px 16px;font-size:0.85rem;" aria-label="Voltar para o perfil">Voltar</a>
        </div>

        <form id="editProfileForm" novalidate>
            <div class="form-group">
                <label class="gs-label" for="nome">Nome</label>
                <input type="text" id="nome" name="nome" class="gs-input" required autocomplete="given-name" aria-required="true">
            </div>
            <div class="form-group">
                <label class="gs-label" for="sobrenome">Sobrenome</label>
                <input type="text" id="sobrenome" name="sobrenome" class="gs-input" required autocomplete="family-name" aria-required="true">
            </div>
            <div class="form-group" id="generoGroup">
                <label class="gs-label" for="genero">Gênero</label>
                <select id="genero" name="genero" class="gs-input" required aria-required="true">
                    <option value="M">Masculino</option>
                    <option value="F">Feminino</option>
                    <option value="O">Outro</option>
                </select>
            </div>

            <!-- Rodada 6: data de nascimento só para quem ainda não informou (contas antigas); depois não muda -->
            <div class="form-group" id="nascimentoGroup" hidden>
                <label class="gs-label" for="dataNascimento">Data de nascimento</label>
                <input type="date" id="dataNascimento" name="data_nascimento" class="gs-input" autocomplete="bday" aria-describedby="nascimentoAjuda">
                <p id="nascimentoAjuda" class="gs-hint ap-ajuda">Usada para conferir a faixa de idade dos desafios. Depois de salva, ela não pode ser alterada por aqui.</p>
            </div>

            <div id="formMsg" class="gs-msg" aria-live="polite" style="margin-bottom:16px;"></div>

            <div style="display:flex;gap:10px;">
                <button type="submit" id="submitBtn" class="gs-btn gs-btn-primary" style="flex:1;" aria-label="Salvar alterações do perfil">
                    Salvar Alterações
                </button>
                <a href="/perfil" class="gs-btn gs-btn-secondary" aria-label="Cancelar e voltar para o perfil">Cancelar</a>
            </div>
        </form>

        <!-- Rodada 4: dados da academia (só conta de academia; montado por alterar-perfil.js + js/endereco.js) -->
        <section id="academiaSecao" class="ap-academia" aria-labelledby="academiaTitulo" hidden>
            <h2 id="academiaTitulo" class="ap-secao-titulo">Endereço e contato da academia</h2>
            <p id="academiaAviso" class="gs-hint" hidden></p>
            <form id="academiaForm" novalidate hidden>
                <div class="form-group">
                    <label class="gs-label" for="acTelefone">Telefone</label>
                    <input type="tel" id="acTelefone" class="gs-input" data-mask="telefone" placeholder="(11) 99999-9999">
                </div>
                <div id="acEndereco"></div>
                <div id="academiaMsg" class="gs-msg" aria-live="polite"></div>
                <button type="submit" id="academiaBtn" class="gs-btn gs-btn-primary gs-btn-full">Salvar endereço</button>
            </form>
        </section>
    </div>

<script src="../js/api.js"></script>
<script src="/js/endereco.js"></script>
<script src="/js/paginas/alterar-perfil.js"></script>
</body>
</html>
