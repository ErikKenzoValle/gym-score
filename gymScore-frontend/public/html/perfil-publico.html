<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil - GymScore</title>
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/perfil-publico.css">
    <link rel="stylesheet" href="/css/moderacao.css">
</head>
<body>
<div class="pub-page">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px;">
        <button type="button" class="gs-voltar" id="btnVoltar" aria-label="Voltar">&larr; Voltar</button>
        <span style="font-size:1rem;font-weight:600;">Perfil</span>
    </div>

    <div id="loadMsg" class="gs-msg" style="display:none;" role="alert"></div>

    <div id="profileContent" hidden>
        <div class="pub-avatar" id="pubAvatar">👤</div>
        <h1 class="pub-name" id="pubName">–</h1>
        <p class="pub-elo" id="pubElo">–</p>

        <div class="pub-stats">
            <div class="pub-stat">
                <div class="pub-stat-val" id="pubPontos">–</div>
                <div class="pub-stat-lbl">Pontos</div>
            </div>
            <div class="pub-stat">
                <div class="pub-stat-val" id="pubDesafios">–</div>
                <div class="pub-stat-lbl">Desafios</div>
            </div>
        </div>

        <div class="md-acoes pub-acoes" id="pubAcoes" hidden>
            <a class="gs-btn gs-btn-secondary" id="btnDenunciar" href="/denunciar">Denunciar</a>
        </div>

        <h2 style="font-size:1rem;font-weight:600;margin-bottom:14px;">Histórico de Desafios</h2>
        <ul class="hist-list" id="histList"></ul>
        <div id="histEmpty" hidden style="text-align:center;color:var(--text-muted);padding:32px 0;font-size:0.9rem;">Nenhum desafio encerrado encontrado.</div>
    </div>
</div>

<script src="../js/api.js"></script>
<script src="/js/paginas/perfil-publico.js"></script>
</body>
</html>
