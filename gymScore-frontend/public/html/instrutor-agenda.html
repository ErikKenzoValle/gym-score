<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda do instrutor — GymScore</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/gestao.css">
</head>
<body data-perfil="instrutor">

<main class="gx-page">
    <header>
        <div class="gx-saudacao">Painel do instrutor</div>
        <h1 class="gx-nome" id="instNome">Instrutor</h1>
    </header>

    <nav class="gx-abas" aria-label="Seções do instrutor">
        <a class="gx-aba" href="/instrutor" data-aba="agenda">Agenda</a>
        <a class="gx-aba" href="/instrutor/vagas" data-aba="vagas">Vagas</a>
        <a class="gx-aba" href="/instrutor/ganhos" data-aba="ganhos">Ganhos</a>
    </nav>

    <div id="vinculoBox"></div>
    <div id="filtros" class="gx-abas" role="group" aria-label="Filtrar agenda" hidden></div>
    <div id="conteudo" aria-live="polite"></div>
    <div class="gx-rodape-lista"><button type="button" class="gx-btn contorno" id="maisBtn" hidden>Carregar mais</button></div>
</main>

<script src="../js/api.js"></script>
<script src="../js/gestao.js"></script>
<script src="/js/paginas/instrutor-agenda.js"></script>
</body>
</html>
