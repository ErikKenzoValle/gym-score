<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda — GymScore</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/instrutor.css">
</head>
<body data-perfil="instrutor">

<div class="page">
    <!-- Header -->
    <div class="inst-header">
        <div class="inst-header-saudacao">Bem-vindo</div>
        <div class="inst-header-nome" id="instNome">Instrutor</div>
        <span class="inst-badge" id="instBadge">INSTRUTOR</span>
    </div>

    <!-- Seção agenda -->
    <div class="section-title" id="agendaTitle">MINHA AGENDA — 0 EVENTOS</div>

    <div id="loadMsg" class="gs-msg"></div>
    <div id="eventosList" aria-live="polite"></div>

    <!-- Empty state -->
    <div id="emptyState" class="empty-state" style="display:none;">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"
             aria-hidden="true">
            <rect x="3" y="4" width="18" height="18" rx="2"/>
            <line x1="16" y1="2" x2="16" y2="6"/>
            <line x1="8" y1="2" x2="8" y2="6"/>
            <line x1="3" y1="10" x2="21" y2="10"/>
        </svg>
        <p>Nenhum evento na sua agenda.</p>
    </div>
</div>

<script src="../js/api.js"></script>
<script>
    if (!Auth.require()) throw new Error('unauthenticated');

    var user = Auth.getUser();
    if (user && user.perfil !== 'instrutor') {
        window.location.href = user.perfil === 'academia' ? '/academia' : '/menu';
        throw new Error('perfil não autorizado');
    }
    document.body.dataset.perfil = 'instrutor';

    if (user) {
        document.getElementById('instNome').textContent = (user.nome || 'Instrutor').toUpperCase();
        document.getElementById('instBadge').textContent = 'INSTRUTOR' + (user.academia_nome ? ' • ' + user.academia_nome : '');
    }

    function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

    async function carregarAgenda() {
        var loadMsg = document.getElementById('loadMsg');
        loadMsg.className = 'gs-msg show';
        loadMsg.textContent = 'Carregando agenda...';

        try {
            var resp  = await API.agendaInstrutor();
            var lista = resp.data || [];
            loadMsg.classList.remove('show');

            document.getElementById('agendaTitle').textContent =
                'MINHA AGENDA — ' + lista.length + (lista.length === 1 ? ' EVENTO' : ' EVENTOS');

            var container = document.getElementById('eventosList');
            container.innerHTML = '';

            if (lista.length === 0) {
                document.getElementById('emptyState').style.display = 'block';
                return;
            }

            lista.forEach(function(d) {
                var status  = d.status || 'aberto';
                var dtStr   = '—';
                var dt      = d.data_hora || d.data_encerramento;
                if (dt) dtStr = new Date(dt).toLocaleDateString('pt-BR', { day:'2-digit', month:'short', year:'numeric' });

                var div = document.createElement('div');
                div.className = 'evento-card';
                div.innerHTML =
                    '<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:6px;">' +
                        '<div class="evento-titulo">' + esc(d.titulo) + '</div>' +
                        '<span class="status-badge status-' + status + '">' + status.replace('_',' ') + '</span>' +
                    '</div>' +
                    '<div class="evento-meta">' +
                        '<span>' + dtStr + '</span>' +
                        (d.local ? '<span>' + esc(d.local).substring(0,30) + '</span>' : '') +
                    '</div>' +
                    '<a href="/instrutor/checkin?id=' + d.id + '" class="btn-gerenciar" aria-label="Gerenciar check-in">GERENCIAR →</a>';

                container.appendChild(div);
            });
        } catch(err) {
            loadMsg.className = 'gs-msg error show';
            loadMsg.textContent = 'Erro ao carregar agenda: ' + err.message;
        }
    }

    carregarAgenda();
    renderBottomNav('/instrutor');
</script>
</body>
</html>
