basePath: /
definitions:
  models.AbrirRecursoRequest:
    properties:
      texto:
        type: string
    required:
    - texto
    type: object
  models.AcademiaResumo:
    properties:
      id:
        type: integer
      nome_fantasia:
        type: string
    type: object
  models.AcaoAdminResponse:
    properties:
      alterado:
        type: boolean
      dados: {}
    type: object
  models.AdminLoginRequest:
    properties:
      email:
        maxLength: 150
        type: string
      senha:
        maxLength: 200
        type: string
    required:
    - email
    - senha
    type: object
  models.AdminResponse:
    properties:
      ativo:
        type: boolean
      criado_em:
        type: string
      criado_por:
        type: integer
      email:
        type: string
      id:
        type: integer
      nome:
        type: string
      papel:
        type: string
      ultimo_login_em:
        type: string
    type: object
  models.AdminSenhaTemporariaResponse:
    properties:
      admin:
        $ref: '#/definitions/models.AdminResponse'
      senha_temporaria:
        type: string
    type: object
  models.AdminTrocarSenhaRequest:
    properties:
      nova_senha:
        maxLength: 72
        minLength: 12
        type: string
      senha_atual:
        maxLength: 200
        type: string
    required:
    - nova_senha
    - senha_atual
    type: object
  models.AlterarSenhaRequest:
    properties:
      nova_senha:
        maxLength: 72
        minLength: 8
        type: string
      senha_atual:
        type: string
    required:
    - nova_senha
    - senha_atual
    type: object
  models.AmigoAlvoRequest:
    properties:
      id_amigo:
        type: integer
    required:
    - id_amigo
    type: object
  models.AnulacaoResponse:
    properties:
      cancelado_centavos:
        type: integer
      debitos:
        items:
          $ref: '#/definitions/models.DebitoResponse'
        type: array
      estornado_centavos:
        description: tirado dos saldos (estorno_anulacao)
        type: integer
      id_desafio:
        type: integer
      id_punicao:
        type: integer
      inscricoes_devolvidas_centavos:
        type: integer
      modo:
        type: string
      pendentes_cancelados:
        type: integer
      reserva_devolvida_centavos:
        type: integer
      status_desafio:
        type: string
      taxa_estornada_centavos:
        type: integer
    type: object
  models.AnularResultadoRequest:
    properties:
      id_denuncia:
        minimum: 1
        type: integer
      id_usuario_punido:
        minimum: 1
        type: integer
      justificativa:
        type: string
      modo:
        type: string
      motivo:
        maxLength: 500
        minLength: 3
        type: string
    required:
    - id_usuario_punido
    - justificativa
    - modo
    - motivo
    type: object
  models.AplicarPunicaoRequest:
    properties:
      fim:
        type: string
      id_academia:
        minimum: 1
        type: integer
      id_denuncia:
        minimum: 1
        type: integer
      id_usuario:
        minimum: 1
        type: integer
      justificativa:
        type: string
      motivo:
        maxLength: 500
        minLength: 3
        type: string
      tipo:
        type: string
    required:
    - id_usuario
    - justificativa
    - motivo
    - tipo
    type: object
  models.AsaasPaymentResponse:
    properties:
      billingType:
        type: string
      customer:
        type: string
      dueDate:
        type: string
      id:
        type: string
      status:
        type: string
      value:
        type: number
    type: object
  models.AsaasWebhookPayload:
    properties:
      event:
        type: string
      payment:
        $ref: '#/definitions/models.AsaasPaymentResponse'
    type: object
  models.AtualizarPerfilRequest:
    properties:
      genero:
        enum:
        - M
        - F
        - O
        type: string
      nome:
        maxLength: 100
        minLength: 2
        type: string
      sobrenome:
        maxLength: 100
        minLength: 2
        type: string
    type: object
  models.AuditoriaAdminResponse:
    properties:
      acao:
        type: string
      admin_email:
        type: string
      admin_nome:
        type: string
      alvo_id:
        type: integer
      alvo_tipo:
        type: string
      criado_em:
        type: string
      detalhes:
        type: object
      id:
        type: integer
      id_admin:
        type: integer
      ip:
        type: string
      motivo:
        type: string
    type: object
  models.AvaliarDesafioRequest:
    properties:
      nota:
        maximum: 5
        minimum: 1
        type: integer
    required:
    - nota
    type: object
  models.BanimentoInfo:
    properties:
      banido_em:
        type: string
      id_punicao:
        type: integer
      motivo:
        type: string
      pode_recorrer:
        type: boolean
      recorrer_ate:
        type: string
      recurso:
        $ref: '#/definitions/models.RecursoResponse'
    type: object
  models.CadastroAdminResponse:
    properties:
      aprovado_em:
        type: string
      cnpj:
        type: string
      cref:
        description: Instrutor
        type: string
      criado_em:
        type: string
      especialidade:
        type: string
      id:
        type: integer
      id_academia:
        type: integer
      motivo_rejeicao:
        type: string
      nome_fantasia:
        description: Academia
        type: string
      razao_social:
        type: string
      status:
        type: string
      tipo:
        description: academia | instrutor
        type: string
      usuario:
        $ref: '#/definitions/models.UsuarioResumoAdmin'
    type: object
  models.CandidatarRequest:
    properties:
      lance_centavos:
        minimum: 0
        type: integer
      mensagem:
        maxLength: 500
        type: string
    type: object
  models.CandidatoResumo:
    properties:
      cref:
        type: string
      especialidade:
        type: string
      id:
        type: integer
      nome:
        type: string
      vinculado:
        description: vinculado a esta academia
        type: boolean
    type: object
  models.CandidaturaAdminResponse:
    properties:
      criado_em:
        type: string
      id:
        type: integer
      id_instrutor:
        type: integer
      lance_centavos:
        type: integer
      mensagem:
        type: string
      nome_instrutor:
        type: string
      status:
        type: string
    type: object
  models.CandidaturaResponse:
    properties:
      atualizado_em:
        type: string
      criado_em:
        type: string
      id:
        type: integer
      id_desafio:
        type: integer
      instrutor:
        allOf:
        - $ref: '#/definitions/models.CandidatoResumo'
        description: só na lista da academia dona
      lance:
        type: number
      lance_centavos:
        type: integer
      mensagem:
        type: string
      status:
        type: string
    type: object
  models.CarteiraDebitosResponse:
    properties:
      aberto_centavos:
        type: integer
      itens:
        items:
          $ref: '#/definitions/models.DebitoResponse'
        type: array
      saque_bloqueado:
        type: boolean
    type: object
  models.CarteiraPendentesResponse:
    properties:
      a_liberar_centavos:
        type: integer
      itens:
        items:
          $ref: '#/definitions/models.PagamentoPendenteResponse'
        type: array
      limite:
        type: integer
      pagina:
        type: integer
      retido_centavos:
        type: integer
      total:
        type: integer
    type: object
  models.ConferenciaDashboardAdmin:
    properties:
      confere:
        type: boolean
      divergencia_centavos:
        description: aplicações − origens (0 = confere)
        type: integer
      lado_aplicacoes_centavos:
        description: saldos + custódia + receitas + pendentes − débitos
        type: integer
      lado_origens_centavos:
        description: depósitos − saques + ajustes
        type: integer
      saldos_conferem:
        type: boolean
      saldos_vs_ledger_centavos:
        description: SaldosVsLedgerCentavos = Σ saldos − soma do ledger (0 = confere).
        type: integer
    type: object
  models.ConvidarRequest:
    properties:
      id_amigo:
        type: integer
    required:
    - id_amigo
    type: object
  models.ConviteAcademiaResumo:
    properties:
      convite_em:
        type: string
      id_academia:
        type: integer
      nome_fantasia:
        type: string
    type: object
  models.ConviteInstrutorResponse:
    properties:
      convite:
        allOf:
        - $ref: '#/definitions/models.ConviteAcademiaResumo'
        description: Convite é nil quando não há convite pendente.
      id_academia:
        description: IDAcademia é o vínculo atual (nil = autônomo).
        type: integer
    type: object
  models.CriarAcademiaRequest:
    properties:
      cnpj:
        description: formato 00.000.000/0000-00
        type: string
      email:
        maxLength: 150
        type: string
      endereco:
        maxLength: 255
        type: string
      nome:
        maxLength: 100
        minLength: 2
        type: string
      nome_fantasia:
        maxLength: 150
        minLength: 2
        type: string
      razao_social:
        maxLength: 150
        minLength: 2
        type: string
      senha:
        maxLength: 72
        minLength: 6
        type: string
      sobrenome:
        maxLength: 100
        type: string
      telefone:
        maxLength: 20
        type: string
    required:
    - cnpj
    - email
    - nome
    - nome_fantasia
    - razao_social
    - senha
    type: object
  models.CriarAdminRequest:
    properties:
      email:
        maxLength: 150
        type: string
      motivo:
        maxLength: 500
        minLength: 3
        type: string
      nome:
        maxLength: 100
        minLength: 2
        type: string
      papel:
        enum:
        - superadmin
        - admin
        type: string
    required:
    - email
    - motivo
    - nome
    - papel
    type: object
  models.CriarDenunciaRequest:
    properties:
      categoria:
        type: string
      descricao:
        type: string
      id_denunciado:
        minimum: 1
        type: integer
      id_desafio:
        minimum: 1
        type: integer
    required:
    - categoria
    - descricao
    - id_denunciado
    type: object
  models.CriarDesafioRequest:
    properties:
      categoria:
        maxLength: 30
        type: string
      data_evento:
        description: |-
          DataEvento aceita RFC3339 ("2026-11-20T09:00:00-03:00") ou "YYYY-MM-DDTHH:MM" / "YYYY-MM-DD HH:MM"
          (horário local do servidor). Precisa estar no futuro.
        type: string
      descricao:
        maxLength: 2000
        type: string
      dividir_pote:
        type: boolean
      id_instrutor:
        description: |-
          Instrutor: instrutor_selecao "designado" (padrão; exige id_instrutor vinculado) ou "vaga_aberta"
          (sem id_instrutor; exige instrutor_teto_centavos; instrutores se candidatam com um lance <= teto).
          instrutor_modo_pagamento: fixo (padrão) | percentual | fixo_percentual.
        type: integer
      instrutor_fixo_centavos:
        maximum: 10000000
        minimum: 0
        type: integer
      instrutor_modo_pagamento:
        enum:
        - fixo
        - percentual
        - fixo_percentual
        type: string
      instrutor_pct:
        maximum: 100
        minimum: 0
        type: integer
      instrutor_selecao:
        enum:
        - designado
        - vaga_aberta
        type: string
      instrutor_teto_centavos:
        maximum: 10000000
        minimum: 0
        type: integer
      latitude:
        maximum: 90
        minimum: -90
        type: number
      local:
        maxLength: 200
        type: string
      longitude:
        maximum: 180
        minimum: -180
        type: number
      percentual_pote:
        maximum: 100
        minimum: 0
        type: integer
      posicoes_podio:
        maximum: 5
        minimum: 1
        type: integer
      premio_fixo_centavos:
        description: |-
          Premiação: prêmio fixo (reservado do saldo da academia) + parcela das inscrições (percentual_pote
          de T, se dividir_pote). dividir_pote omitido = true; percentual_pote omitido = o máximo permitido
          (100 - taxa da plataforma - instrutor_pct). Com dividir_pote=false, percentual_pote é gravado 0.
        maximum: 10000000
        minimum: 0
        type: integer
      titulo:
        maxLength: 200
        minLength: 3
        type: string
      vagas:
        maximum: 500
        minimum: 2
        type: integer
      valor_entrada_centavos:
        maximum: 1000000
        minimum: 0
        type: integer
    required:
    - data_evento
    - local
    - posicoes_podio
    - titulo
    - vagas
    type: object
  models.CriarInstrutorRequest:
    properties:
      cref:
        maxLength: 20
        minLength: 4
        type: string
      especialidade:
        maxLength: 100
        type: string
    required:
    - cref
    type: object
  models.CriarUsuarioRequest:
    properties:
      cpf:
        description: formato 000.000.000-00
        type: string
      data_nascimento:
        type: string
      email:
        maxLength: 150
        type: string
      genero:
        enum:
        - M
        - F
        - O
        type: string
      nome:
        maxLength: 100
        minLength: 2
        type: string
      senha:
        maxLength: 72
        minLength: 8
        type: string
      sobrenome:
        maxLength: 100
        minLength: 2
        type: string
    required:
    - cpf
    - data_nascimento
    - email
    - genero
    - nome
    - senha
    - sobrenome
    type: object
  models.DashboardAcademiaResponse:
    properties:
      academia:
        $ref: '#/definitions/models.AcademiaResumo'
      avaliacao_media:
        description: AvaliacaoMedia (0 a 5, duas casas) considera só avaliações dos
          desafios desta academia.
        type: number
      avaliacoes_total:
        type: integer
      desafios_por_status:
        additionalProperties:
          type: integer
        type: object
      inscritos_mes:
        description: 'InscritosMes: inscrições feitas no mês corrente em desafios
          não cancelados da academia.'
        type: integer
      instrutores_vinculados:
        type: integer
      pote_em_jogo:
        type: number
      pote_em_jogo_centavos:
        description: 'PoteEmJogo: soma das entradas dos inscritos em desafios abertos
          ou em andamento.'
        type: integer
      proximos_eventos:
        description: 'ProximosEventos: até 5 desafios abertos com data_evento futura,
          do mais próximo ao mais distante.'
        items:
          $ref: '#/definitions/models.DesafioResponse'
        type: array
      taxa_presenca:
        description: |-
          TaxaPresenca é o percentual (0 a 100, uma casa) de inscritos presentes nos desafios em andamento
          e encerrados; 0 quando não há base.
        type: number
      total_desafios:
        description: TotalDesafios soma todos os status; DesafiosPorStatus sempre
          traz as 4 chaves (0 quando vazio).
        type: integer
    type: object
  models.DashboardAdminResponse:
    properties:
      conferencia:
        $ref: '#/definitions/models.ConferenciaDashboardAdmin'
      desafios_por_status:
        additionalProperties:
          type: integer
        description: DesafiosPorStatus conta todos os desafios por status.
        type: object
      financeiro:
        $ref: '#/definitions/models.FinanceiroDashboardAdmin'
      pendencias:
        $ref: '#/definitions/models.PendenciasDashboardAdmin'
      receita:
        $ref: '#/definitions/models.ReceitaDashboardAdmin'
    type: object
  models.DebitoResponse:
    properties:
      criado_em:
        type: string
      id:
        type: integer
      id_desafio:
        type: integer
      id_usuario:
        type: integer
      motivo:
        type: string
      quitado:
        type: boolean
      quitado_em:
        type: string
      saldo_restante_centavos:
        type: integer
      titulo_desafio:
        type: string
      usuario:
        allOf:
        - $ref: '#/definitions/models.UsuarioRefModeracao'
        description: só admin
      valor_centavos:
        type: integer
    type: object
  models.DecidirDenunciaAcademiaRequest:
    properties:
      decisao_texto:
        type: string
      punicao:
        $ref: '#/definitions/models.PunicaoAcademiaRequest'
      status:
        type: string
    required:
    - decisao_texto
    - status
    type: object
  models.DecidirDenunciaAdminRequest:
    properties:
      decisao_texto:
        type: string
      motivo:
        maxLength: 500
        minLength: 3
        type: string
      punicoes:
        items:
          $ref: '#/definitions/models.PunicaoDecisaoRequest'
        maxItems: 5
        type: array
      status:
        type: string
    required:
    - decisao_texto
    - motivo
    - status
    type: object
  models.DenunciaAcademiaDetalhe:
    properties:
      denuncia:
        $ref: '#/definitions/models.DenunciaResponse'
      historico_na_academia:
        description: HistoricoNaAcademia são as punições do denunciado aplicadas no
          escopo desta academia.
        items:
          $ref: '#/definitions/models.PunicaoResponse'
        type: array
    type: object
  models.DenunciaAdminDetalhe:
    properties:
      denuncia:
        $ref: '#/definitions/models.DenunciaResponse'
      eventos:
        items:
          $ref: '#/definitions/models.EventoResponse'
        type: array
      outras_do_denunciado:
        description: OutrasDoDenunciado são as demais denúncias contra o mesmo usuário
          (mais recentes primeiro, até 20).
        items:
          $ref: '#/definitions/models.DenunciaResponse'
        type: array
      punicoes:
        items:
          $ref: '#/definitions/models.PunicaoResponse'
        type: array
      reincidencia_advertencias_90d:
        description: ReincidenciaAdvertencias90d conta advertências do denunciado
          nos últimos 90 dias.
        type: integer
    type: object
  models.DenunciaResponse:
    properties:
      categoria:
        type: string
      criado_em:
        type: string
      decidida_em:
        type: string
      decisao_texto:
        type: string
      denunciado:
        $ref: '#/definitions/models.UsuarioRefModeracao'
      denunciante:
        allOf:
        - $ref: '#/definitions/models.UsuarioRefModeracao'
        description: só admin
      descricao:
        type: string
      em_analise_comigo:
        description: academia
        type: boolean
      encaminhada_em:
        type: string
      evidencias:
        items:
          $ref: '#/definitions/models.EvidenciaResponse'
        type: array
      gerou_punicao:
        type: boolean
      id:
        type: integer
      id_academia_julgadora:
        type: integer
      id_denunciante:
        description: só admin
        type: integer
      id_desafio:
        type: integer
      id_responsavel:
        description: só admin
        type: integer
      id_responsavel_admin:
        type: integer
      jurisdicao:
        type: string
      prazo_academia_ate:
        type: string
      status:
        type: string
    type: object
  models.DesafioDetalheAdminResponse:
    properties:
      candidaturas:
        items:
          $ref: '#/definitions/models.CandidaturaAdminResponse'
        type: array
      desafio:
        $ref: '#/definitions/models.DesafioResumoAdmin'
      financeiro:
        $ref: '#/definitions/models.FinanceiroDesafioAdmin'
      ledger:
        description: Ledger do desafio (até 100 linhas mais recentes; LedgerTotal
          = total de linhas).
        items:
          $ref: '#/definitions/models.TransacaoAdminResponse'
        type: array
      ledger_total:
        type: integer
      participantes:
        items:
          $ref: '#/definitions/models.ParticipanteAdminResponse'
        type: array
      podio:
        items:
          $ref: '#/definitions/models.PodioResponse'
        type: array
    type: object
  models.DesafioResponse:
    properties:
      academia:
        allOf:
        - $ref: '#/definitions/models.AcademiaResumo'
        description: null só em legados
      aguardando_relancamento:
        type: boolean
      categoria:
        type: string
      criado_em:
        type: string
      data_evento:
        description: null só em desafios legados
        type: string
      descricao:
        type: string
      financeiro:
        $ref: '#/definitions/models.FinanceiroResponse'
      id:
        type: integer
      instrutor:
        allOf:
        - $ref: '#/definitions/models.InstrutorResumo'
        description: null se sem instrutor (legados)
      instrutor_ganho:
        $ref: '#/definitions/models.GanhoInstrutorResponse'
      instrutor_selecao:
        type: string
      latitude:
        type: number
      local:
        type: string
      longitude:
        type: number
      pagamentos_liberam_em:
        type: string
      pagamentos_retidos:
        type: boolean
      participantes:
        items:
          $ref: '#/definitions/models.ParticipanteResponse'
        type: array
      participantes_count:
        type: integer
      pode_avaliar:
        type: boolean
      pode_cancelar:
        type: boolean
      pode_candidatar:
        description: |-
          PodeCandidatar: instrutor pode dar lance (vaga aberta, desafio aberto, evento futuro).
          PodeEscolherInstrutor: academia dona pode escolher entre os candidatos.
        type: boolean
      pode_editar:
        type: boolean
      pode_entrar:
        description: Flags de ação para o usuário logado
        type: boolean
      pode_escolher_instrutor:
        type: boolean
      pode_iniciar:
        type: boolean
      pode_lancar_podio:
        type: boolean
      pode_marcar_presenca:
        type: boolean
      pode_sair:
        type: boolean
      podio:
        items:
          $ref: '#/definitions/models.PodioResponse'
        type: array
      podio_lancado_em:
        description: |-
          Janela de contestação e anulação (moderação). podio_lancado_em = base da liberação;
          pagamentos_liberam_em (só no detalhe) = quando os créditos do pódio entram nos saldos (null se já
          liberados ou sem pódio); pagamentos_retidos = há contestação segurando a liberação.
          resultado_anulado: o resultado foi anulado pelo admin (modo relancar_podio | devolver_inscricoes);
          aguardando_relancamento: anulado em relancar_podio e de volta a em_andamento (só a academia dona relança).
        type: string
      posicoes_podio:
        type: integer
      pote:
        type: number
      pote_centavos:
        type: integer
      premiacao:
        allOf:
        - $ref: '#/definitions/models.PremiacaoResponse'
        description: |-
          Premiacao (todos): prêmio total previsto + lista por posição. Financeiro só vai para a academia
          dona, InstrutorGanho para o instrutor designado e Vaga para instrutores (oferta da vaga aberta).
      premiacao_prevista_centavos:
        description: |-
