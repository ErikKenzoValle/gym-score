        $ref: '#/definitions/models.UsuarioRefModeracao'
      vigente:
        type: boolean
    type: object
  models.ReceitaAdminResponse:
    properties:
      criado_em:
        type: string
      id:
        type: integer
      id_desafio:
        type: integer
      id_transacao:
        type: integer
      origem:
        description: taxa_inscricao | tarifa_saque
        type: string
      valor_centavos:
        type: integer
    type: object
  models.ReceitaDashboardAdmin:
    properties:
      ate:
        type: string
      de:
        type: string
      por_origem:
        additionalProperties:
          type: integer
        type: object
      total_centavos:
        type: integer
    type: object
  models.ReceitasAdminResponse:
    properties:
      itens:
        items:
          $ref: '#/definitions/models.ReceitaAdminResponse'
        type: array
      limite:
        type: integer
      pagina:
        type: integer
      totais_por_origem:
        additionalProperties:
          type: integer
        type: object
      total:
        type: integer
      total_centavos:
        type: integer
    type: object
  models.RecursoBanimentoRequest:
    properties:
      email:
        maxLength: 150
        type: string
      senha:
        maxLength: 72
        type: string
      texto:
        type: string
    required:
    - email
    - senha
    type: object
  models.RecursoFilaItem:
    properties:
      punicao:
        $ref: '#/definitions/models.PunicaoResponse'
      recurso:
        $ref: '#/definitions/models.RecursoResponse'
    type: object
  models.RecursoResponse:
    properties:
      criado_em:
        type: string
      decisao_texto:
        type: string
      id:
        type: integer
      id_punicao:
        type: integer
      julgado_em:
        type: string
      julgado_por:
        description: só admin
        type: integer
      status:
        type: string
      texto:
        type: string
    type: object
  models.RedefinirSenhaRequest:
    properties:
      nova_senha:
        maxLength: 72
        minLength: 8
        type: string
      token:
        maxLength: 200
        minLength: 20
        type: string
    required:
    - nova_senha
    - token
    type: object
  models.ReservaAdminResponse:
    properties:
      id_academia:
        type: integer
      id_criador:
        type: integer
      id_desafio:
        type: integer
      reserva_centavos:
        description: valor vigente na coluna do desafio
        type: integer
      retido_centavos:
        description: líquido ainda retido no ledger
        type: integer
      status:
        $ref: '#/definitions/models.StatusDesafio'
      titulo:
        type: string
    type: object
  models.SaqueAcaoResponse:
    properties:
      alterado:
        description: 'Alterado=false: o saque já estava no estado pedido (idempotente;
          sem auditoria).'
        type: boolean
      saque:
        $ref: '#/definitions/models.SaqueAdminResponse'
      status_asaas:
        description: StatusAsaas é o status consultado no Asaas (vazio quando não
          houve consulta).
        type: string
    type: object
  models.SaqueAdminResponse:
    properties:
      asaas_payment_id:
        type: string
      asaas_transfer_id:
        type: string
      atualizado_em:
        type: string
      criado_em:
        type: string
      descricao:
        type: string
      em_revisao:
        type: boolean
      id:
        type: integer
      id_desafio:
        type: integer
      id_transacao_origem:
        type: integer
      id_usuario:
        type: integer
      referencia_asaas:
        description: externalReference "saque-<id>"
        type: string
      revisao_motivo:
        type: string
      status:
        type: string
      tarifa_centavos:
        type: integer
      tipo:
        $ref: '#/definitions/models.TipoTransacao'
      usuario:
        $ref: '#/definitions/models.UsuarioResumoAdmin'
      valor_centavos:
        type: integer
      valor_saque_centavos:
        description: ValorSaqueCentavos é o valor transferido (positivo); TarifaCentavos
          a tarifa ainda cobrada (0 se devolvida).
        type: integer
    type: object
  models.SaqueRequest:
    properties:
      chave_pix:
        maxLength: 140
        minLength: 3
        type: string
      tipo_chave:
        enum:
        - CPF
        - CNPJ
        - EMAIL
        - PHONE
        - EVP
        type: string
      valor_centavos:
        maximum: 1000000
        minimum: 500
        type: integer
    required:
    - chave_pix
    - tipo_chave
    - valor_centavos
    type: object
  models.StatusDesafio:
    enum:
    - aberto
    - em_andamento
    - encerrado
    - cancelado
    type: string
    x-enum-varnames:
    - StatusAberto
    - StatusEmAndamento
    - StatusEncerrado
    - StatusCancelado
  models.TipoTransacao:
    enum:
    - estorno_anulacao
    - abatimento_debito
    - deposito
    - saque
    - entrada_desafio
    - estorno_desafio
    - premio_desafio
    - ajuste
    - reserva_desafio
    - estorno_reserva
    - pagamento_instrutor
    - receita_academia
    - tarifa_saque
    type: string
    x-enum-varnames:
    - TipoEstornoAnulacao
    - TipoAbatimentoDebito
    - TipoDeposito
    - TipoSaque
    - TipoEntradaDesafio
    - TipoEstornoDesafio
    - TipoPremioDesafio
    - TipoAjuste
    - TipoReservaDesafio
    - TipoEstornoReserva
    - TipoPagamentoInstrutor
    - TipoReceitaAcademia
    - TipoTarifaSaque
  models.TransacaoAdminResponse:
    properties:
      asaas_payment_id:
        type: string
      asaas_transfer_id:
        type: string
      atualizado_em:
        type: string
      criado_em:
        type: string
      descricao:
        type: string
      em_revisao:
        type: boolean
      id:
        type: integer
      id_desafio:
        type: integer
      id_transacao_origem:
        type: integer
      id_usuario:
        type: integer
      revisao_motivo:
        type: string
      status:
        type: string
      tipo:
        $ref: '#/definitions/models.TipoTransacao'
      valor_centavos:
        type: integer
    type: object
  models.TransacaoDetalheAdminResponse:
    properties:
      derivadas:
        description: 'Derivadas são as linhas originadas por esta (ex.: a tarifa de
          um saque).'
        items:
          $ref: '#/definitions/models.TransacaoAdminResponse'
        type: array
      origem:
        allOf:
        - $ref: '#/definitions/models.TransacaoAdminResponse'
        description: 'Origem é a linha que originou esta (ex.: o saque de uma tarifa_saque).'
      transacao:
        $ref: '#/definitions/models.TransacaoAdminResponse'
      usuario:
        $ref: '#/definitions/models.UsuarioResumoAdmin'
    type: object
  models.TrocarPapelAdminRequest:
    properties:
      motivo:
        maxLength: 500
        minLength: 3
        type: string
      papel:
        enum:
        - superadmin
        - admin
        type: string
    required:
    - motivo
    - papel
    type: object
  models.UsuarioAdminResponse:
    properties:
      banido_em:
        description: Estado efetivo da moderação (bloqueado* acima = banimento, mantidos
          por compatibilidade do painel).
        type: string
      bloqueado:
        type: boolean
      bloqueado_em:
        type: string
      bloqueado_motivo:
        type: string
      cpf_mascarado:
        type: string
      criado_em:
        type: string
      email:
        type: string
      id:
        type: integer
      motivo_bloqueio:
        type: string
      nome:
        type: string
      perfil:
        type: string
      saldo_centavos:
        type: integer
      sobrenome:
        type: string
      suspenso:
        type: boolean
      suspenso_ate:
        type: string
      ultima_vez:
        type: string
      username:
        type: string
    type: object
  models.UsuarioDetalheAdminResponse:
    properties:
      academia:
        $ref: '#/definitions/models.CadastroAdminResponse'
      desafios:
        description: Desafios em que o usuário está inscrito (até 100, mais recentes
          primeiro).
        items:
          $ref: '#/definitions/models.ParticipacaoAdminResponse'
        type: array
      instrutor:
        $ref: '#/definitions/models.CadastroAdminResponse'
      ledger:
        $ref: '#/definitions/models.PaginaAdmin-models_TransacaoAdminResponse'
      ledger_confere:
        type: boolean
      soma_ledger_centavos:
        description: SomaLedgerCentavos é a soma do ledger efetivo; LedgerConfere
          = (soma == saldo).
        type: integer
      usuario:
        $ref: '#/definitions/models.UsuarioAdminResponse'
    type: object
  models.UsuarioRefModeracao:
    properties:
      email:
        description: só admin
        type: string
      id:
        type: integer
      nome:
        type: string
      username:
        type: string
    type: object
  models.UsuarioResumoAdmin:
    properties:
      bloqueado:
        type: boolean
      email:
        type: string
      id:
        type: integer
      nome:
        type: string
      perfil:
        type: string
      sobrenome:
        type: string
    type: object
  models.VagaInstrutorResponse:
    properties:
      minha_candidatura:
        $ref: '#/definitions/models.CandidaturaResponse'
      modo_pagamento:
        type: string
      pct:
        type: integer
      teto_centavos:
        type: integer
    type: object
  models.VincularInstrutorRequest:
    properties:
      email:
        maxLength: 150
        type: string
    required:
    - email
    type: object
  utils.APIResponse:
    properties:
      codigo:
        description: 'Codigo identifica erros que o front trata de forma própria (ex.:
          conta_banida, conta_suspensa).'
        type: string
      data: {}
      error:
        type: string
      message:
        type: string
      success:
        type: boolean
    type: object
host: localhost:3000
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: API para o sistema GymScore de desafios e treinos.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: GymScore API
  version: "1.0"
paths:
  /api/academia/dashboard:
    get:
      description: 'Indicadores só da academia logada: desafios por status, inscritos
        no mês, pote em jogo, taxa de presença, avaliação média e próximos eventos.
        Exige perfil academia.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.DashboardAcademiaResponse'
              type: object
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - BearerAuth: []
      summary: Dashboard da academia
      tags:
      - academia
  /api/academia/denuncias:
    get:
      description: Fila da jurisdição da academia logada (suborno de instrutor nos
        desafios dela), com o prazo. Sem o denunciante.
      parameters:
      - description: aberta | em_analise | procedente | improcedente | arquivada
        in: query
        name: status
        type: string
      - description: Página
        in: query
        name: pagina
        type: integer
      - description: Itens por página
        in: query
        name: limite
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.PaginaAdmin-models_DenunciaResponse'
              type: object
      security:
      - BearerAuth: []
      summary: Denúncias da academia
      tags:
      - moderacao-academia
  /api/academia/denuncias/{id}:
    get:
      description: Sem o denunciante; inclui o histórico de punições do denunciado
        nesta academia. 404 quando a denúncia não está (mais) na jurisdição da academia.
      parameters:
      - description: ID da denúncia
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.DenunciaAcademiaDetalhe'
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - BearerAuth: []
      summary: Detalhe da denúncia (academia)
      tags:
      - moderacao-academia
  /api/academia/denuncias/{id}/assumir:
    post:
      description: aberta -> em_analise com a conta da academia como responsável.
      parameters:
      - description: ID da denúncia
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.DenunciaResponse'
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - BearerAuth: []
      summary: Assumir denúncia (academia)
      tags:
      - moderacao-academia
  /api/academia/denuncias/{id}/decidir:
    post:
      consumes:
      - application/json
      description: 'procedente | improcedente | arquivada com decisao_texto; punição
        opcional só em procedente e só advertencia ou bloqueio_academia (na própria
        academia). Suspensão/banimento/anulação: encaminhar ao admin.'
      parameters:
      - description: ID da denúncia
        in: path
        name: id
        required: true
        type: integer
      - description: Decisão
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.DecidirDenunciaAcademiaRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.DenunciaResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - BearerAuth: []
      summary: Decidir denúncia (academia)
      tags:
      - moderacao-academia
  /api/academia/denuncias/{id}/encaminhar:
    post:
      consumes:
      - application/json
      description: 'Caminho só de ida: jurisdição vira admin, status volta a aberta.
        Justificativa obrigatória.'
      parameters:
      - description: ID da denúncia
        in: path
        name: id
        required: true
        type: integer
      - description: Justificativa
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.EncaminharDenunciaRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.DenunciaResponse'
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - BearerAuth: []
      summary: Encaminhar denúncia ao admin (academia)
      tags:
      - moderacao-academia
  /api/academia/denuncias/{id}/evidencias/{ordem}:
    get:
      description: Só enquanto a jurisdição for da academia logada.
      parameters:
      - description: ID da denúncia
        in: path
        name: id
        required: true
        type: integer
      - description: Ordem (1..3)
        in: path
        name: ordem
        required: true
        type: integer
      produces:
      - image/jpeg
      - image/png
      - image/webp
      responses:
        "200":
          description: OK
          schema:
            type: file
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - BearerAuth: []
      summary: Arquivo de evidência (academia)
      tags:
      - moderacao-academia
  /api/academia/desafios:
    get:
      description: Lista paginada dos desafios da academia logada, com filtro opcional
        de status. Exige perfil academia.
      parameters:
      - description: aberto | em_andamento | encerrado | cancelado
        in: query
        name: status
        type: string
      - description: Página (1..)
        in: query
        name: pagina
        type: integer
      - description: Itens por página (padrão 20, máx. 100)
        in: query
        name: limite
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.ListaDesafiosResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - BearerAuth: []
      summary: Desafios da academia
      tags:
      - academia
  /api/academia/instrutores:
    get:
      description: Lista paginada dos instrutores vinculados à academia logada, com
        a contagem de desafios ativos de cada um. Exige perfil academia.
      parameters:
      - description: Página (1..)
        in: query
        name: pagina
        type: integer
      - description: Itens por página (padrão 20, máx. 100)
        in: query
        name: limite
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.ListaInstrutoresVinculadosResponse'
              type: object
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - BearerAuth: []
      summary: Instrutores vinculados
      tags:
      - academia
    post:
      consumes:
      - application/json
      description: Envia à conta de instrutor com o e-mail informado um CONVITE de
        vínculo com a academia logada; o vínculo só existe depois que o instrutor
        aceitar (POST /api/instrutor/convite/aceitar). 409 se ele já tem vínculo ou
        convite pendente de outra academia; repetir renova o convite. Exige perfil
        academia.
      parameters:
      - description: E-mail da conta de instrutor
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.VincularInstrutorRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/utils.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.InstrutorVinculadoResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - BearerAuth: []
      summary: Convidar instrutor (vínculo)
      tags:
      - academia
  /api/academia/instrutores/{id}:
    delete:
      description: Remove o vínculo do instrutor com a academia logada e o notifica.
        Bloqueado (409) se ele for o instrutor designado de desafio aberto ou em andamento.
        Exige perfil academia.
      parameters:
      - description: ID do instrutor (instrutores.id)
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - BearerAuth: []
      summary: Desvincular instrutor
      tags:
      - academia
  /api/academia/instrutores/convites:
    get:
      description: Convites enviados pela academia logada que o instrutor ainda não
        aceitou nem recusou. Exige perfil academia.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.APIResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/models.InstrutorVinculadoResponse'
                  type: array
              type: object
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - BearerAuth: []
      summary: Convites de vínculo pendentes
      tags:
      - academia
  /api/academia/instrutores/convites/{id}:
    delete:
      description: Retira o convite pendente da academia logada para o instrutor.
        Exige perfil academia.
      parameters:
      - description: ID do instrutor (instrutores.id)
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - BearerAuth: []
      summary: Cancelar convite de vínculo
      tags:
      - academia
  /api/academia/punicoes:
    get:
      description: Punições de escopo da academia logada (advertências e bloqueios).
      parameters:
      - description: advertencia | bloqueio_academia
        in: query
        name: tipo
        type: string
      - description: Só vigentes
        in: query
        name: vigente
        type: boolean
      - description: Página
        in: query
        name: pagina
        type: integer
      - description: Itens por página
        in: query
        name: limite
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
